      document.addEventListener('mousemove',e=>{smx=e.pageX;smy=e.pageY})
      function sparkle(){
        if(Math.abs(smx-osmx)>1||Math.abs(smy-osmy)>1){osmx=smx;osmy=smy;for(let i=0;i<N;i++){if(!sv[i]){stars[i].style.left=(ssx[i]=smx)+'px';stars[i].style.top=(ssy[i]=smy)+'px';stars[i].style.clip='rect(0px,5px,5px,0px)';stars[i].childNodes[0].style.backgroundColor='white';stars[i].childNodes[1].style.backgroundColor='white';stars[i].style.visibility='visible';sv[i]=50;break}}}
        for(let i=0;i<N;i++){if(sv[i])uStar(i);if(tv[i])uTiny(i)}
        setTimeout(sparkle,40)
      }
      function uStar(i){if(--sv[i]===25)stars[i].style.clip='rect(1px,4px,4px,1px)';if(sv[i]){ssy[i]+=1+Math.random()*3;ssx[i]+=(i%5-2)/5;if(ssy[i]<document.documentElement.scrollHeight){stars[i].style.top=ssy[i]+'px';stars[i].style.left=ssx[i]+'px'}else{stars[i].style.visibility='hidden';sv[i]=0;return}}else{tv[i]=50;tiny[i].style.top=(tty[i]=ssy[i])+'px';tiny[i].style.left=(ttx[i]=ssx[i])+'px';tiny[i].style.width='2px';tiny[i].style.height='2px';tiny[i].style.backgroundColor='white';stars[i].style.visibility='hidden';tiny[i].style.visibility='visible'}}
      function uTiny(i){if(--tv[i]===25){tiny[i].style.width='1px';tiny[i].style.height='1px'}if(tv[i]){tty[i]+=1+Math.random()*3;ttx[i]+=(i%5-2)/5;if(tty[i]<document.documentElement.scrollHeight){tiny[i].style.top=tty[i]+'px';tiny[i].style.left=ttx[i]+'px'}else{tiny[i].style.visibility='hidden';tv[i]=0;return}}else tiny[i].style.visibility='hidden'}
      sparkle()
    }

    // ── Main: load profile ──
    async function loadProfile() {
      const slug = getSlug()
      if (!slug) { show404(); return }

      const { data, error } = await sb.from('profiles').select('*').eq('slug', slug).single()
      if (error || !data) { show404(); return }

      document.title = `${data.display_name || slug} — lies.lat`

      // Discord avatar + username
      const pfpImg = document.getElementById('pfp-img')
      const usernameEl = document.getElementById('username-label')
      if (data.discord_id) {
        usernameEl.textContent = data.display_name || slug
        const apis = [
          { url: `https://japi.rest/discord/v1/user/${data.discord_id}`, parse: j => ({ av: j.data?.avatar, name: j.data?.username }) },
          { url: `https://discordlookup.mesalytic.moe/v1/user/${data.discord_id}`, parse: j => ({ av: j.avatar?.id, name: j.global_name || j.username }) },
        ]
        for (const api of apis) {
          try {
            const res = await fetch(api.url); if (!res.ok) continue
            const json = await res.json(); const { av, name } = api.parse(json)
            if (av) {
              pfpImg.src = `https://cdn.discordapp.com/avatars/${data.discord_id}/${av}.${av.startsWith('a_')?'gif':'png'}?size=256`
              if (name && !data.display_name) usernameEl.textContent = name
              break
            }
          } catch(e) {}
        }
      } else if (data.avatar_url) {
        pfpImg.src = data.avatar_url
        usernameEl.textContent = data.display_name || slug
      }

      // BG video
      if (data.bg_video) {
        bgVideo.src = data.bg_video
      } else {
        bgVideo.style.display = 'none'
      }

      // Playlist
      if (data.tracks && data.tracks.length) {
        playlist = data.tracks
        playerAudio.src = playlist[0].src
        startTitleAnim()
      } else {
        document.getElementById('player').style.display = 'none'
      }

      // Socials
      const sc = document.getElementById('socials-container')
      const s = data.socials || {}
      if (s.tiktok)    sc.appendChild(makeSocialIcon('tiktok', s.tiktok))
      if (s.twitter)   sc.appendChild(makeSocialIcon('twitter', s.twitter))
      if (s.instagram) sc.appendChild(makeSocialIcon('instagram', s.instagram))
      if (s.link)      sc.appendChild(makeSocialIcon('link', s.link))

      // Effects
      const fx = data.effects || { snow: true, sparkle: true, crossCursor: true }
      if (fx.snow)        initSnow()
      else if (fx.rain)   initRain()
      if (fx.crossCursor) initCrossCursor()
      if (fx.sparkle)     initSparkle()
    }

    function show404() {
      document.getElementById('enter-overlay').style.display = 'none'
      document.querySelector('.pfp-wrap').style.display = 'none'
      document.querySelector('.username-label').style.display = 'none'
      document.getElementById('player').style.display = 'none'
      document.getElementById('socials-container').style.display = 'none'
      document.getElementById('not-found').style.display = 'flex'
    }

    loadProfile()
  </script>
</body>
</html>
