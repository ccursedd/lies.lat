<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lies.lat — admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { background: #000; color: #fff; font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace; -webkit-font-smoothing: antialiased; }
    a { color: rgba(255,255,255,0.4); text-decoration: none; }
    a:hover { color: rgba(255,255,255,0.8); }

    .btn { background: transparent; border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.4); font-family: inherit; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; padding: 10px 28px; cursor: pointer; transition: all 0.25s; border-radius: 2px; }
    .btn:hover { border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.8); }
    .btn-primary { border-color: rgba(88,101,242,0.3); color: rgba(88,101,242,0.7); }
    .btn-primary:hover { border-color: rgba(88,101,242,0.5); color: rgba(88,101,242,1); }
    .btn-danger { border-color: rgba(255,80,80,0.15); color: rgba(255,80,80,0.4); }
    .btn-danger:hover { border-color: rgba(255,80,80,0.4); color: rgba(255,80,80,0.8); }
    .btn-sm { padding: 6px 16px; font-size: 9px; letter-spacing: 2px; }
    .btn-success { border-color: rgba(80,200,80,0.2); color: rgba(80,200,80,0.5); }
    .btn-success:hover { border-color: rgba(80,200,80,0.4); color: rgba(80,200,80,0.9); }

    input, select, textarea { background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.1); color: #fff; font-family: inherit; font-size: 13px; padding: 8px 0; outline: none; width: 100%; transition: border-color 0.25s; }
    input:focus, select:focus, textarea:focus { border-color: rgba(255,255,255,0.3); }
    input::placeholder { color: rgba(255,255,255,0.12); }
    select { cursor: pointer; }
    select option { background: #111; }
    textarea { resize: vertical; min-height: 60px; border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: 3px; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

    .fade-in { opacity: 0; animation: fadeIn 0.6s ease forwards; }
    @keyframes fadeIn { to { opacity: 1; } }

    /* AUTH */
    .auth-page { height: 100vh; display: flex; align-items: center; justify-content: center; }
    .auth-box { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 280px; }
    .auth-title { font-size: 11px; letter-spacing: 6px; text-transform: uppercase; opacity: 0.2; margin-bottom: 8px; }
    .auth-field { width: 100%; position: relative; }
    .auth-field input { text-align: center; letter-spacing: 2px; }
    .field-line { position: absolute; bottom: 0; left: 50%; width: 0; height: 1px; background: rgba(255,255,255,0.5); transition: width 0.3s ease, left 0.3s ease; }
    .auth-field input:focus ~ .field-line { width: 100%; left: 0; }
    .error-msg { font-size: 10px; color: rgba(255,80,80,0.7); letter-spacing: 1px; min-height: 14px; text-align: center; }

    /* DASHBOARD */
    .dashboard { display: none; min-height: 100vh; }
    .top-bar { border-bottom: 1px solid rgba(255,255,255,0.06); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
    .top-bar-title { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.25; }
    .main { padding: 40px 32px; max-width: 1100px; margin: 0 auto; }
    .section-title { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.2; margin-bottom: 24px; }

    /* USER CARDS */
    .users-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 48px; }
    .user-card { border: 1px solid rgba(255,255,255,0.06); border-radius: 4px; padding: 20px; transition: border-color 0.2s; position: relative; }
    .user-card:hover { border-color: rgba(255,255,255,0.12); }
    .user-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,0.05); flex-shrink: 0; }
    .user-name { font-size: 13px; color: rgba(255,255,255,0.8); }
    .user-slug { font-size: 10px; color: rgba(255,255,255,0.25); letter-spacing: 1px; margin-top: 2px; }
    .user-card-actions { display: flex; gap: 8px; margin-top: 14px; }
    .user-status { position: absolute; top: 16px; right: 16px; width: 6px; height: 6px; border-radius: 50%; background: rgba(80,200,80,0.5); }

    /* CREATE USER MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: #0a0a0a; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; padding: 36px; width: 520px; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.2; margin-bottom: 32px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
    .form-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
    .form-label { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.3; }
    .form-actions { display: flex; gap: 12px; margin-top: 32px; justify-content: flex-end; }
    .section-divider { border: none; border-top: 1px solid rgba(255,255,255,0.05); margin: 24px 0; }

    /* EFFECTS CONFIG */
    .effects-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .effect-toggle { border: 1px solid rgba(255,255,255,0.06); border-radius: 3px; padding: 10px 14px; cursor: pointer; transition: all 0.2s; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.25); display: flex; align-items: center; gap: 8px; }
    .effect-toggle.active { border-color: rgba(88,101,242,0.3); color: rgba(88,101,242,0.7); }
    .effect-toggle-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.1); flex-shrink: 0; }
    .effect-toggle.active .effect-toggle-dot { background: rgba(88,101,242,0.7); }

    /* TOAST */
    .toast { position: fixed; bottom: 24px; right: 24px; background: #111; border: 1px solid rgba(255,255,255,0.08); padding: 12px 20px; font-size: 11px; letter-spacing: 1px; border-radius: 3px; opacity: 0; transform: translateY(8px); transition: all 0.3s; z-index: 999; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { border-color: rgba(80,200,80,0.2); color: rgba(80,200,80,0.8); }
    .toast.error { border-color: rgba(255,80,80,0.2); color: rgba(255,80,80,0.8); }

    /* PROFILE PREVIEW */
    .slug-preview { font-size: 10px; color: rgba(88,101,242,0.5); letter-spacing: 1px; margin-top: 4px; }
  </style>
</head>
<body>

<!-- AUTH -->
<div class="auth-page fade-in" id="auth-page">
  <div class="auth-box">
    <div class="auth-title">lies.lat admin</div>
    <div class="auth-field">
      <input type="email" id="username" placeholder="email" autocomplete="email" autofocus>
      <div class="field-line"></div>
    </div>
    <div class="auth-field">
      <input type="password" id="password" placeholder="password" autocomplete="current-password">
      <div class="field-line"></div>
    </div>
    <div class="error-msg" id="err"></div>
    <button class="btn" onclick="login()">enter</button>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="top-bar">
    <div class="top-bar-title">lies.lat / admin</div>
    <div style="display:flex;gap:12px;align-items:center;">
      <a href="/" style="font-size:9px;letter-spacing:2px;text-transform:uppercase;opacity:0.2;text-decoration:none;color:#fff;">← site</a>
      <button class="btn btn-sm btn-primary" onclick="openCreateModal()">+ new user</button>
      <button class="btn btn-sm" onclick="logout()">sign out</button>
    </div>
  </div>
  <div class="main">
    <div class="section-title">users</div>
    <div class="users-grid" id="users-grid">
      <div style="font-size:11px;opacity:0.2;letter-spacing:2px;">loading...</div>
    </div>
  </div>
</div>

<!-- CREATE/EDIT USER MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">new user</div>

    <div class="form-row">
      <div class="form-field">
        <div class="form-label">display name</div>
        <input type="text" id="f-name" placeholder="mev">
      </div>
      <div class="form-field">
        <div class="form-label">url slug</div>
        <input type="text" id="f-slug" placeholder="mev" oninput="updateSlugPreview()">
        <div class="slug-preview" id="slug-preview">lies.lat/mev</div>
      </div>
    </div>

    <div class="form-field">
      <div class="form-label">discord user id</div>
      <input type="text" id="f-discord" placeholder="922332301126414337" oninput="previewDiscordPfp()">
    </div>

    <div class="form-row">
      <div class="form-field">
        <div class="form-label">tiktok url</div>
        <input type="text" id="f-tiktok" placeholder="https://tiktok.com/@user">
      </div>
      <div class="form-field">
        <div class="form-label">twitter / x url</div>
        <input type="text" id="f-twitter" placeholder="https://x.com/user">
      </div>
    </div>

    <div class="form-row">
      <div class="form-field">
        <div class="form-label">instagram url</div>
        <input type="text" id="f-instagram" placeholder="https://instagram.com/user">
      </div>
      <div class="form-field">
        <div class="form-label">custom link url</div>
        <input type="text" id="f-link" placeholder="https://...">
      </div>
    </div>

    <div class="form-field">
      <div class="form-label">custom link label</div>
      <input type="text" id="f-link-label" placeholder="my website">
    </div>

    <div class="form-field">
      <div class="form-label">background video url</div>
      <input type="text" id="f-video" placeholder="https://github.com/.../video.mp4">
    </div>

    <div class="form-field">
      <div class="form-label">music tracks (json array)</div>
      <textarea id="f-tracks" placeholder='[{"title":"SONG NAME","src":"/tracks/song.mp3"}]'></textarea>
    </div>

    <hr class="section-divider">
    <div class="form-label" style="margin-bottom:12px;">effects</div>
    <div class="effects-grid" id="effects-grid">
      <div class="effect-toggle active" data-effect="snow" onclick="toggleEffect(this)">
        <div class="effect-toggle-dot"></div>
        snow
      </div>
      <div class="effect-toggle active" data-effect="sparkle" onclick="toggleEffect(this)">
        <div class="effect-toggle-dot"></div>
        sparkle trail
      </div>
      <div class="effect-toggle active" data-effect="crossCursor" onclick="toggleEffect(this)">
        <div class="effect-toggle-dot"></div>
        cross cursor
      </div>
      <div class="effect-toggle" data-effect="rain" onclick="toggleEffect(this)">
        <div class="effect-toggle-dot"></div>
        rain
      </div>
    </div>

    <div class="form-actions">
      <button class="btn btn-sm" onclick="closeModal()">cancel</button>
      <button class="btn btn-sm btn-primary" onclick="saveUser()">save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://dyxxpuirsuqtuehvijdf.supabase.co'
  const SUPABASE_KEY = 'sb_publishable_8IaNO6bOuQHZdVyAPeP1Qg_sjjcGcVy'
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

  let editingId = null

  // ── Auth ──
  document.querySelectorAll('input').forEach(el => {
    el.addEventListener('keydown', e => { if (e.key === 'Enter') login() })
  })

  async function login() {
    const email = document.getElementById('username').value.trim()
    const pass  = document.getElementById('password').value
    const err   = document.getElementById('err')
    err.textContent = ''
    if (!email || !pass) { err.textContent = 'fill in both fields'; return }

    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass })
    if (error) { err.textContent = error.message || 'denied'; document.getElementById('password').value = ''; return }
    showDashboard()
  }

  async function logout() {
    await sb.auth.signOut()
    document.getElementById('dashboard').style.display = 'none'
    document.getElementById('auth-page').style.display = 'flex'
  }

  async function checkSession() {
    const { data: { session } } = await sb.auth.getSession()
    if (session) showDashboard()
  }

  function showDashboard() {
    document.getElementById('auth-page').style.display = 'none'
    document.getElementById('dashboard').style.display = 'block'
    loadUsers()
  }

  // ── Users ──
  async function loadUsers() {
    const grid = document.getElementById('users-grid')
    grid.innerHTML = '<div style="font-size:11px;opacity:0.2;letter-spacing:2px;">loading...</div>'

    const { data, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false })
    if (error) { grid.innerHTML = `<div style="font-size:11px;color:rgba(255,80,80,0.5);">${error.message}</div>`; return }
    if (!data.length) { grid.innerHTML = '<div style="font-size:11px;opacity:0.15;letter-spacing:2px;">no users yet</div>'; return }

    grid.innerHTML = ''
    data.forEach(u => grid.appendChild(buildCard(u)))
  }

  function buildCard(u) {
    const card = document.createElement('div')
    card.className = 'user-card'
    card.innerHTML = `
      <div class="user-status"></div>
      <div class="user-card-header">
        <img class="user-avatar" src="${u.avatar_url || ''}" onerror="this.src=''" alt="">
        <div>
          <div class="user-name">${u.display_name || u.slug}</div>
          <div class="user-slug">lies.lat/${u.slug}</div>
        </div>
      </div>
      <div style="font-size:10px;opacity:0.2;letter-spacing:1px;margin-bottom:4px;">${u.discord_id ? 'discord: '+u.discord_id : ''}</div>
      <div class="user-card-actions">
        <button class="btn btn-sm btn-primary" onclick='editUser(${JSON.stringify(u)})'>edit</button>
        <a class="btn btn-sm" href="/u/${u.slug}" target="_blank">view →</a>
        <button class="btn btn-sm btn-danger" onclick="deleteUser('${u.id}')">del</button>
      </div>
    `
    // try to load discord avatar
    if (u.discord_id) fetchDiscordAvatar(u.discord_id, card.querySelector('.user-avatar'))
    return card
  }

  async function fetchDiscordAvatar(discordId, imgEl) {
    const apis = [
      { url: `https://japi.rest/discord/v1/user/${discordId}`, parse: j => j.data?.avatar },
      { url: `https://discordlookup.mesalytic.moe/v1/user/${discordId}`, parse: j => j.avatar?.id },
    ]
    for (const api of apis) {
      try {
        const res = await fetch(api.url); if (!res.ok) continue
        const json = await res.json(); const av = api.parse(json)
        if (av) { imgEl.src = `https://cdn.discordapp.com/avatars/${discordId}/${av}.${av.startsWith('a_')?'gif':'png'}?size=128`; break }
      } catch(e) {}
    }
  }

  async function deleteUser(id) {
    if (!confirm('delete this user?')) return
    const { error } = await sb.from('profiles').delete().eq('id', id)
    if (error) { showToast(error.message, 'error'); return }
    showToast('user deleted')
    loadUsers()
  }

  // ── Modal ──
  function openCreateModal() {
    editingId = null
    document.getElementById('modal-title').textContent = 'new user'
    clearForm()
    document.getElementById('modal').classList.add('open')
  }

  function editUser(u) {
    editingId = u.id
    document.getElementById('modal-title').textContent = 'edit user'
    document.getElementById('f-name').value = u.display_name || ''
    document.getElementById('f-slug').value = u.slug || ''
    document.getElementById('f-discord').value = u.discord_id || ''
    document.getElementById('f-tiktok').value = u.socials?.tiktok || ''
    document.getElementById('f-twitter').value = u.socials?.twitter || ''
    document.getElementById('f-instagram').value = u.socials?.instagram || ''
    document.getElementById('f-link').value = u.socials?.link || ''
    document.getElementById('f-link-label').value = u.socials?.link_label || ''
    document.getElementById('f-video').value = u.bg_video || ''
    document.getElementById('f-tracks').value = u.tracks ? JSON.stringify(u.tracks, null, 2) : ''
    updateSlugPreview()

    // restore effects
    document.querySelectorAll('.effect-toggle').forEach(el => {
      const eff = el.dataset.effect
      const on = u.effects ? u.effects[eff] : (eff === 'snow' || eff === 'sparkle' || eff === 'crossCursor')
      el.classList.toggle('active', !!on)
    })

    document.getElementById('modal').classList.add('open')
  }

  function closeModal() { document.getElementById('modal').classList.remove('open') }

  function clearForm() {
    ['f-name','f-slug','f-discord','f-tiktok','f-twitter','f-instagram','f-link','f-link-label','f-video','f-tracks'].forEach(id => {
      document.getElementById(id).value = ''
    })
    document.getElementById('slug-preview').textContent = 'lies.lat/...'
    document.querySelectorAll('.effect-toggle').forEach(el => {
      const eff = el.dataset.effect
      el.classList.toggle('active', eff === 'snow' || eff === 'sparkle' || eff === 'crossCursor')
    })
  }

  function updateSlugPreview() {
    const val = document.getElementById('f-slug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'')
    document.getElementById('slug-preview').textContent = 'lies.lat/' + (val || '...')
  }

  function previewDiscordPfp() { /* live preview could go here */ }

  function toggleEffect(el) { el.classList.toggle('active') }

  async function saveUser() {
    const slug = document.getElementById('f-slug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'')
    if (!slug) { showToast('slug is required', 'error'); return }

    const effects = {}
    document.querySelectorAll('.effect-toggle').forEach(el => {
      effects[el.dataset.effect] = el.classList.contains('active')
    })

    let tracks = null
    try {
      const tv = document.getElementById('f-tracks').value.trim()
      if (tv) tracks = JSON.parse(tv)
    } catch(e) { showToast('invalid tracks json', 'error'); return }

    const payload = {
      slug,
      display_name: document.getElementById('f-name').value.trim(),
      discord_id:   document.getElementById('f-discord').value.trim(),
      bg_video:     document.getElementById('f-video').value.trim(),
      tracks,
      effects,
      socials: {
        tiktok:     document.getElementById('f-tiktok').value.trim(),
        twitter:    document.getElementById('f-twitter').value.trim(),
        instagram:  document.getElementById('f-instagram').value.trim(),
        link:       document.getElementById('f-link').value.trim(),
        link_label: document.getElementById('f-link-label').value.trim(),
      },
      updated_at: new Date().toISOString(),
    }

    let error
    if (editingId) {
      ;({ error } = await sb.from('profiles').update(payload).eq('id', editingId))
    } else {
      ;({ error } = await sb.from('profiles').insert({ ...payload, created_at: new Date().toISOString() }))
    }

    if (error) { showToast(error.message, 'error'); return }
    showToast(editingId ? 'user updated' : 'user created', 'success')
    closeModal()
    loadUsers()
  }

  // ── Toast ──
  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast')
    t.textContent = msg
    t.className = `toast ${type} show`
    setTimeout(() => t.className = 'toast', 2800)
  }

  checkSession()
</script>
</body>
</html>
