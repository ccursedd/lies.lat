<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lies.lat</title>
  <script>
    // Get the current path
    let path = window.location.pathname;
    let slug = path.replace(/^\/|\/$/g, '');
    
    // If there's a slug (like "mev") and it's not a reserved path
    if (slug && slug !== '' && slug !== 'index.html' && slug !== 'admin.html' && slug !== 'profile.html' && slug !== 'favicon.ico' && !slug.startsWith('fav/')) {
      // Remove any query params
      slug = slug.split('?')[0].split('#')[0];
      // Redirect to hash-based URL (this is the only way on GitHub Pages)
      window.location.replace('/#' + slug);
    }
  </script>
</head>
<body style="background:#000;display:flex;justify-content:center;align-items:center;height:100vh;color:white;font-family:monospace;">
  Redirecting...
</body>
</html>
