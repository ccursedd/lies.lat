<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // This file should rarely be used on Vercel, but keep it simple
    let path = window.location.pathname;
    let slug = path.replace(/^\/|\/$/g, '');
    
    if (slug && slug !== '' && slug !== 'index.html' && slug !== 'admin.html' && slug !== 'profile.html') {
      // On Vercel, just go to profile.html with the slug in the path
      window.location.replace('/profile.html?u=' + slug);
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body>Loading...</body>
</html>
