<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lies.lat</title>
  <script>
    // GitHub Pages SPA routing — redirect /u/slug to /?u=slug
    // This 404.html catches all unknown paths and redirects to index with query param
    const path = window.location.pathname
    const parts = path.split('/').filter(Boolean)

    // If it's /u/something or /something, redirect to profile.html?u=something
    if (parts.length >= 1) {
      const slug = parts[0] === 'u' ? parts[1] : parts[0]
      if (slug && slug !== 'admin') {
        window.location.replace('/profile.html?u=' + slug)
      } else {
        window.location.replace('/')
      }
    } else {
      window.location.replace('/')
    }
  </script>
</head>
<body></body>
</html>
