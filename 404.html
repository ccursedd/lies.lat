<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    // Get path and convert to hash silently
    let path = window.location.pathname;
    let slug = path.replace(/^\//, '').replace(/\/$/, '');
    
    if (slug && slug !== '' && slug !== 'index.html' && slug !== 'admin.html' && slug !== 'profile.html' && slug !== 'favicon.ico') {
      slug = slug.split('?')[0].split('#')[0];
      // Redirect to root with hash - keeps URL looking clean
      window.location.replace('/#' + slug);
    } else if (window.location.hash && window.location.hash.length > 1) {
      let hashSlug = window.location.hash.substring(1);
      if (hashSlug && hashSlug !== 'admin') {
        window.location.replace('/profile.html?u=' + hashSlug);
      }
    }
  </script>
</head>
<body></body>
</html>
