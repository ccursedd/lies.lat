<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lies.lat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#000;
  color:#fff;
  font-family:monospace;
  overflow:hidden;
}

/* fade */
.fade{animation:fade .4s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* AUTH */
#auth{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.box{
  display:flex;
  flex-direction:column;
  gap:16px;
  width:260px;
  align-items:center;
}

.title{
  letter-spacing:6px;
  font-size:11px;
  opacity:.2;
}

input{
  width:100%;
  background:none;
  border:none;
  border-bottom:1px solid #222;
  color:#fff;
  padding:10px;
  text-align:center;
}

input:focus{border-color:#555;}

button{
  background:none;
  border:1px solid #222;
  color:#888;
  padding:10px 20px;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  color:#fff;
  border-color:#555;
}

.msg{font-size:10px;opacity:.5;height:14px;}

/* APP */
#app{
  display:none;
  height:100vh;
  overflow-y:auto;
}

/* topbar */
.top{
  position:sticky;
  top:0;
  background:#000;
  border-bottom:1px solid #111;
  padding:12px;
  display:flex;
  justify-content:space-between;
}

/* grid */
.grid{
  column-count:5;
  column-gap:10px;
  padding:10px;
}

.card{
  break-inside:avoid;
  margin-bottom:10px;
  opacity:0;
  transform:translateY(10px);
  animation:in .4s forwards;
}
@keyframes in{to{opacity:1;transform:none}}

.card img{
  width:100%;
  border-radius:6px;
  transition:.3s;
}
.card img:hover{transform:scale(1.02);}

/* upload */
.upload{
  position:fixed;
  bottom:20px;
  right:20px;
}

.upload label{
  border:1px solid #222;
  padding:12px;
  cursor:pointer;
}

.upload input{display:none;}

.loading{
  text-align:center;
  padding:20px;
  opacity:.3;
}

/* mobile */
@media(max-width:900px){
  .grid{column-count:2;}
}
</style>
</head>

<body>

<div id="auth">
  <div class="box">
    <div class="title">lies.lat</div>
    <input id="email" placeholder="email">
    <input id="password" type="password" placeholder="password">
    <button onclick="login()">enter</button>
    <button onclick="register()">create</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<div id="app">
  <div class="top">
    <div>lies.lat</div>
    <button onclick="logout()">logout</button>
  </div>

  <div id="grid" class="grid"></div>

  <div class="upload">
    <label>
      +
      <input type="file" id="file">
    </label>
  </div>
</div>

<script>
const supabase = window.supabase.createClient(
  "https://ssddpeplnanvnlkrsnjh.supabase.co",
  "sb_publishable_gG27LVBTwhPXkutZvNiEKQ_JL3sO9OD"
);

/* AUTH */
async function login(){
  msg.textContent="...";
  const {error}=await supabase.auth.signInWithPassword({
    email:email.value,
    password:password.value
  });
  msg.textContent=error?error.message:"ok";
}

async function register(){
  msg.textContent="...";
  const {error}=await supabase.auth.signUp({
    email:email.value,
    password:password.value
  });
  msg.textContent=error?error.message:"created";
}

async function logout(){
  await supabase.auth.signOut();
}

/* SESSION */
supabase.auth.onAuthStateChange((e,session)=>{
  if(session){
    auth.style.display="none";
    app.style.display="block";
    loadPosts();
  }else{
    auth.style.display="flex";
    app.style.display="none";
  }
});

/* UPLOAD */
document.getElementById("file").addEventListener("change",upload);

async function upload(){
  const file=this.files[0];
  if(!file) return;

  const user=(await supabase.auth.getUser()).data.user;
  if(!user) return alert("login required");

  const name=Date.now()+"-"+file.name;

  const {error}=await supabase.storage.from("images").upload(name,file);
  if(error) return alert(error.message);

  const {data}=supabase.storage.from("images").getPublicUrl(name);

  await supabase.from("posts").insert({
    user_id:user.id,
    image_url:data.publicUrl
  });

  this.value="";
  loadPosts();
}

/* LOAD */
async function loadPosts(){
  grid.innerHTML='<div class="loading">loading...</div>';

  const {data,error}=await supabase
    .from("posts")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    grid.innerHTML="error loading";
    return;
  }

  grid.innerHTML="";

  data.forEach((p,i)=>{
    const div=document.createElement("div");
    div.className="card";
    div.style.animationDelay=i*0.04+"s";
    div.innerHTML=`<img src="${p.image_url}">`;
    grid.appendChild(div);
  });
}
</script>

</body>
</html>
