<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>stock // dm @metabolizes</title>
  <!-- Font Awesome 6 (minimal icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Google Fonts: Inter + monospace for clean look -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000000;
      font-family: 'Inter', -apple-system, 'Segoe UI', monospace;
      color: #e5e5e5;
      padding: 2rem 1rem;
      font-weight: 400;
      line-height: 1.4;
    }

    /* smooth scroll + subtle transitions */
    html {
      scroll-behavior: smooth;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    /* minimal header */
    .top-section {
      margin-bottom: 2rem;
      text-align: left;
      border-bottom: 1px solid #1f1f1f;
      padding-bottom: 1rem;
    }

    .top-section h1 {
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: -0.2px;
      color: #f0f0f0;
      font-family: monospace;
    }

    .top-section h1 i {
      color: #2a2a2a;
      margin-right: 6px;
    }

    .dm-mini {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #aaa;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dm-mini a {
      color: #dddddd;
      background: #111111;
      padding: 4px 12px;
      border-radius: 24px;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.2s ease;
      border: 0.5px solid #2a2a2a;
    }

    .dm-mini a:hover {
      background: #1e1e1e;
      border-color: #3a3a3a;
      color: white;
    }

    /* category wrappers — pure black cards with subtle separation */
    .category-block {
      margin-bottom: 2rem;
      background: #000000;
      border: none;
    }

    .category-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      border-bottom: 1px solid #181818;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .category-header i {
      font-size: 1rem;
      color: #2e2e2e;
      width: 22px;
    }

    .category-header h2 {
      font-size: 1rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #b0b0b0;
      font-family: monospace;
    }

    /* item list — ultra clean, minimal spacing */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stock-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      transition: all 0.15s ease;
      border-bottom: 1px solid #0c0c0c;
      cursor: pointer;
    }

    .stock-row:hover {
      background: #0a0a0a;
      padding-left: 8px;
      margin-left: -8px;
      border-bottom-color: #1f1f1f;
    }

    .username {
      font-family: 'Menlo', 'Fira Code', 'Courier New', monospace;
      font-size: 0.9rem;
      font-weight: 500;
      color: #cfcfcf;
      letter-spacing: -0.2px;
    }

    .username i {
      font-size: 0.7rem;
      color: #3a3a3a;
      margin-right: 6px;
    }

    .price {
      font-family: monospace;
      font-size: 0.85rem;
      font-weight: 500;
      color: #a0a0a0;
      background: #080808;
      padding: 2px 10px;
      border-radius: 24px;
      letter-spacing: 0.2px;
    }

    /* special note inline (for korblox+headless) — subtle */
    .item-note {
      font-size: 0.65rem;
      color: #5a5a5a;
      font-family: monospace;
      margin-left: 20px;
      margin-top: -2px;
      margin-bottom: 4px;
      padding-left: 6px;
      border-left: 1px solid #1c1c1c;
    }

    /* footer dm bar — minimal, black on black */
    .footer-dm {
      margin-top: 2.5rem;
      padding-top: 1rem;
      text-align: center;
      border-top: 1px solid #121212;
    }

    .buy-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #050505;
      padding: 10px 20px;
      border-radius: 40px;
      text-decoration: none;
      color: #e0e0e0;
      font-weight: 500;
      font-size: 0.85rem;
      border: 0.5px solid #262626;
      transition: all 0.2s ease;
      backdrop-filter: blur(2px);
    }

    .buy-btn i {
      font-size: 1rem;
      color: #2a7faa;
    }

    .buy-btn:hover {
      background: #111111;
      border-color: #3a3a3a;
      transform: scale(0.98);
    }

    .tiny-note {
      font-size: 0.65rem;
      color: #2a2a2a;
      margin-top: 12px;
      text-align: center;
    }

    hr {
      border: none;
      border-top: 1px solid #111;
      margin: 12px 0;
    }

    /* responsivity */
    @media (max-width: 560px) {
      body {
        padding: 1.2rem;
      }
      .username {
        font-size: 0.8rem;
      }
      .price {
        font-size: 0.75rem;
        padding: 2px 8px;
      }
      .category-header h2 {
        font-size: 0.85rem;
      }
    }

    /* removing all glows, just black & smooth */
    ::selection {
      background: #1e1e1e;
      color: #ffffff;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- minimal header with API-inspired status (no overdesign) -->
  <div class="top-section">
    <h1><i class="fas fa-terminal"></i> /stock.list</h1>
    <div class="dm-mini">
      <span>📟 direct purchase →</span>
      <a href="https://t.me/metabolizes" target="_blank" id="dynamicDmLink" rel="noopener noreferrer">@metabolizes</a>
      <span id="apiBadge" style="font-size:0.7rem; color:#2c2c2c;"><i class="fas fa-circle-nodes"></i> api • live</span>
    </div>
  </div>

  <!-- stock container: dynamic list via JS (fully black, minimal) -->
  <div id="stockRoot"></div>

  <!-- footer call to action (smooth, simple) -->
  <div class="footer-dm">
    <a href="https://t.me/metabolizes" target="_blank" class="buy-btn" id="footerTeleLink">
      <i class="fab fa-telegram"></i> dm @metabolizes to buy any username
    </a>
    <div class="tiny-note">
      ⚡ stock updates · instant delivery
    </div>
  </div>
</div>

<script>
  // ----------------------------------------------
  // STOCK DATA (exactly as described, all black style)
  // ----------------------------------------------
  const stockCatalog = [
    {
      category: "dc stock",
      icon: "fab fa-discord",
      items: [
        { username: "@usuns", price: "$6" },
        { username: "@mafiathons", price: "$12" },
        { username: "@cheapishly", price: "$14" },
        { username: "@solutionize", price: "$10" },
        { username: "@calendarize", price: "$12" },
        { username: "@scheduleize", price: "$7" },
        { username: "@bookcased", price: "$11" },
        { username: "@monguor", price: "$7" },
        { username: "@readapts", price: "$5" },
        { username: "@breyed", price: "$3" },
        { username: "@910k.", price: "$8" },
        { username: "@822k.", price: "$8" },
        { username: "@mecsec", price: "$9" },
        { username: "@exabeam", price: "$7" },
        { username: "@afterworking", price: "$9" },
        { username: "@wpqa", price: "$11" },
        { username: "@ouwq", price: "$13" },
        { username: "@wjvu", price: "$6" },
        { username: "@outbleed", price: "$10" },
        { username: "@ficulate", price: "$14" },
        { username: "@enlistees", price: "$112" },
        { username: "@inhalators", price: "$15" },
        { username: "@memorablekisses", price: "$48" },
        { username: "@memorablekiss", price: "$68" },
        { username: "@datelined", price: "$24" }
      ]
    },
    {
      category: "tele stock",
      icon: "fab fa-telegram",
      items: [
        { username: "@calendarize", price: "$16" },
        { username: "@metabolizes", price: "$18" }
      ]
    },
    {
      category: "roblox stock",
      icon: "fab fa-roblox",   // fallback instead
      iconFallback: "fas fa-gamepad",
      items: [
        { username: "@3l4m", price: "$20" },
        { username: "@confirmed", price: "bin 900 co 400" },
        { username: "@networkize", price: "$7" }
      ]
    },
    {
      category: "twitter stock",
      icon: "fab fa-twitter",
      items: [
        { username: "@mafiathons", price: "$9" }
      ]
    },
    {
      category: "epic games stock",
      icon: "fab fa-empire",
      items: [
        { username: "@mafiathons", price: "$11" },
        { username: "@cheapishly", price: "$10" }
      ]
    },
    {
      category: "tiktok stock",
      icon: "fab fa-tiktok",
      items: [
        { username: "@rmzc", price: "$13" },
        { username: "@longtermrls", price: "$23" },
        { username: "@droppingme", price: "$20" },
        { username: "@cantlink", price: "$17" },
        { username: "@puttyconfig", price: "$14" },
        { username: "@pingdns", price: "$15" },
        { username: "@cardtransaction ", price: "$16" },
        { username: "@injectedmalware", price: "$18" },
        { username: "@proxychained", price: "$11" },
        { username: "@screenguis", price: "$24" }
        
      ],
    },
    {
      category: "github stock",
      icon: "fab fa-github",
      items: [
        { username: "@mafiathons", price: "$5" }
      ]
    }
  ];

  // ----------------------------------------------
  // API simulation: returns seller info (telegram dm target)
  // requirement: "use a api to show to dm @metabolizes on tele to buy"
  // we'll fetch this API-like promise and ensure all DM actions point to correct handle.
  // ----------------------------------------------
  function fetchSellerAPI() {
    return new Promise((resolve) => {
      // simulate instant network response
      setTimeout(() => {
        resolve({
          sellerHandle: "@metabolizes",
          usernameClean: "metabolizes",
          baseUrl: "https://t.me/metabolizes",
          note: "DM for fast purchase"
        });
      }, 20);
    });
  }

  // render the entire stock list with black minimal style
  function renderStockList() {
    const root = document.getElementById("stockRoot");
    if (!root) return;
    root.innerHTML = "";

    for (const cat of stockCatalog) {
      // create category container
      const catDiv = document.createElement("div");
      catDiv.className = "category-block";

      // header
      const headerDiv = document.createElement("div");
      headerDiv.className = "category-header";
      let iconHtml = "";
      if (cat.icon) {
        iconHtml = `<i class="${cat.icon}"></i>`;
      } else if (cat.iconFallback) {
        iconHtml = `<i class="${cat.iconFallback}"></i>`;
      } else {
        iconHtml = `<i class="fas fa-tag"></i>`;
      }
      headerDiv.innerHTML = `${iconHtml}<h2>${cat.category.toUpperCase()}</h2>`;
      catDiv.appendChild(headerDiv);

      // item list wrapper
      const listWrapper = document.createElement("div");
      listWrapper.className = "item-list";

      for (const item of cat.items) {
        const row = document.createElement("div");
        row.className = "stock-row";
        
        // left side username
        const userSpan = document.createElement("div");
        userSpan.className = "username";
        userSpan.innerHTML = `<i class="fas fa-at"></i>${item.username}`;
        
        const priceSpan = document.createElement("div");
        priceSpan.className = "price";
        priceSpan.textContent = item.price;
        
        row.appendChild(userSpan);
        row.appendChild(priceSpan);
        listWrapper.appendChild(row);
        
        // if there's a note (korblox+headless)
        if (item.note) {
          const noteDiv = document.createElement("div");
          noteDiv.className = "item-note";
          noteDiv.innerHTML = `<i class="fas fa-info-circle" style="font-size:9px;"></i> ${item.note}`;
          listWrapper.appendChild(noteDiv);
        }
      }
      
      catDiv.appendChild(listWrapper);
      root.appendChild(catDiv);
    }
  }

  // attach smooth click-to-dm using API data: each stock-row will open telegram chat with prefilled item info
  async function attachBuyEventsWithAPI() {
    // first, get seller data from our API imitation
    const sellerInfo = await fetchSellerAPI();
    const sellerClean = sellerInfo.usernameClean; // "metabolizes"
    const baseTelegramUrl = `https://t.me/${sellerClean}`;
    
    // update any static DM links (mini bar + footer) to ensure they match API result
    const allDmLinks = document.querySelectorAll('a[href*="t.me"]');
    allDmLinks.forEach(link => {
      if (link.getAttribute('href')?.includes('t.me/')) {
        // rewrite to correct seller handle
        link.setAttribute('href', `https://t.me/${sellerClean}`);
      }
    });
    
    // also set the api badge text to show api-driven contact
    const badgeSpan = document.getElementById('apiBadge');
    if (badgeSpan) {
      badgeSpan.innerHTML = `<i class="fas fa-check-circle" style="color:#2a7f2a;"></i> api · ${sellerInfo.sellerHandle}`;
    }
    
    // now select all stock rows and add click handler (smooth dm)
    const rows = document.querySelectorAll('.stock-row');
    rows.forEach(row => {
      // remove existing listeners to avoid duplication (but we replace)
      row.removeEventListener('click', row._buyHandler);
      const clickHandler = async (e) => {
        e.stopPropagation();
        // get username from row
        const usernameDiv = row.querySelector('.username');
        let usernameText = "";
        if (usernameDiv) {
          // extract text after @ icon (inner html may contain <i> and text)
          const rawText = usernameDiv.innerText || usernameDiv.textContent;
          usernameText = rawText.replace(/@/g, '').trim();
          // but we want full @username pattern for message
          const fullUsername = rawText.includes('@') ? rawText.trim() : `@${usernameText}`;
          // get price
          const priceEl = row.querySelector('.price');
          const priceVal = priceEl ? priceEl.textContent : '';
          
          // compose message for buyer
          const message = `Hi! I would like to buy ${fullUsername} (${priceVal}). Is it available?`;
          const encodedMsg = encodeURIComponent(message);
          const dmUrl = `https://t.me/${sellerClean}?text=${encodedMsg}`;
          window.open(dmUrl, '_blank');
        } else {
          // fallback generic
          const dmUrl = `https://t.me/${sellerClean}?text=Hey%20I'm%20interested%20in%20a%20username%20from%20your%20stock`;
          window.open(dmUrl, '_blank');
        }
      };
      row.addEventListener('click', clickHandler);
      row._buyHandler = clickHandler;
      // add subtle style to indicate clickability
      row.style.cursor = 'pointer';
    });
  }

  // update footer link + header link using fresh API data
  async function updateGlobalLinks() {
    const apiContact = await fetchSellerAPI();
    const tgLink = `https://t.me/${apiContact.usernameClean}`;
    const headerLink = document.querySelector('.dm-mini a');
    const footerBtn = document.getElementById('footerTeleLink');
    if (headerLink) headerLink.href = tgLink;
    if (footerBtn) footerBtn.href = tgLink;
  }

  // final init: render list, then attach API-driven DM behaviour, all black + smooth
  async function init() {
    renderStockList();               // build DOM structure
    await updateGlobalLinks();      // pre-set link hrefs from API
    await attachBuyEventsWithAPI(); // each row click opens DM to metabolizes (API based)
  }
  
  init();
  
  // optional: small console note (no intrusive)
  console.log("✨ black stock list | api ready → @metabolizes");
</script>
</body>
</html>
