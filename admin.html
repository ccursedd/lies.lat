<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lies.lat - Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', 'Fira Code', monospace;
        }
        
        /* Login Styles */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #000000 100%);
        }
        
        .login-box {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            padding: 40px;
            width: 340px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        
        .login-box h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #ffffff;
            letter-spacing: 2px;
        }
        
        .login-box h1 span {
            color: #4a4a4a;
        }
        
        .login-subtitle {
            font-size: 10px;
            color: #4a4a4a;
            margin-bottom: 30px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        
        .login-box input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 3px;
            color: #ffffff;
            padding: 12px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
        }
        
        .login-box input:focus {
            outline: none;
            border-color: #4a4a4a;
        }
        
        .login-box button {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 3px;
            color: #ffffff;
            padding: 12px;
            margin-top: 20px;
            cursor: pointer;
            font-family: monospace;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        
        .login-box button:hover {
            background: #2a2a2a;
            border-color: #5a5a5a;
        }
        
        .switch-btn {
            text-align: center;
            margin-top: 15px;
            color: #4a4a4a;
            cursor: pointer;
            font-size: 11px;
            transition: color 0.3s;
        }
        
        .switch-btn:hover {
            color: #8a8a8a;
        }
        
        .error {
            color: #ff4444;
            font-size: 11px;
            margin-top: 10px;
            text-align: center;
        }
        
        /* Admin Panel Styles */
        .admin-container {
            display: none;
        }
        
        .header {
            background: #000000;
            border-bottom: 1px solid #1a1a1a;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 2px;
        }
        
        .logo span {
            color: #4a4a4a;
        }
        
        .logout-btn {
            background: none;
            border: 1px solid #2a2a2a;
            border-radius: 3px;
            color: #8a8a8a;
            padding: 6px 15px;
            cursor: pointer;
            font-family: monospace;
            font-size: 10px;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        
        .logout-btn:hover {
            border-color: #ff4444;
            color: #ff4444;
        }
        
        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }
        
        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1px;
            background: #1a1a1a;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #0a0a0a;
            padding: 25px 20px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #ffffff;
        }
        
        .stat-label {
            font-size: 9px;
            color: #4a4a4a;
            margin-top: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        /* Filters */
        .filters-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-input {
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 3px;
            color: #ffffff;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 11px;
            min-width: 180px;
        }
        
        .filter-input::placeholder {
            color: #3a3a3a;
        }
        
        .refresh-btn {
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 3px;
            color: #ffffff;
            padding: 8px 20px;
            cursor: pointer;
            font-family: monospace;
            font-size: 10px;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        
        .refresh-btn:hover {
            background: #2a2a2a;
        }
        
        .delete-all-btn {
            background: #1a0a0a;
            border-color: #442222;
            color: #aa4444;
        }
        
        .delete-all-btn:hover {
            background: #2a0a0a;
            border-color: #ff4444;
            color: #ff4444;
        }
        
        /* Reports Grid */
        .reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 16px;
        }
        
        .report-card {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 4px;
            transition: all 0.3s;
        }
        
        .report-card:hover {
            border-color: #2a2a2a;
            transform: translateY(-2px);
        }
        
        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 18px;
            border-bottom: 1px solid #1a1a1a;
            background: #0d0d0d;
        }
        
        .report-pc {
            font-weight: bold;
            color: #ffffff;
            font-size: 13px;
        }
        
        .report-time {
            font-size: 9px;
            color: #4a4a4a;
        }
        
        .report-body {
            padding: 15px 18px;
        }
        
        .report-row {
            margin: 10px 0;
            font-size: 11px;
        }
        
        .label {
            color: #4a4a4a;
            display: inline-block;
            width: 75px;
            letter-spacing: 0.5px;
        }
        
        .value {
            color: #c0c0c0;
        }
        
        .public-ip {
            color: #44aa44;
        }
        
        .local-ip {
            color: #aa8844;
        }
        
        .report-footer {
            padding: 12px 18px;
            border-top: 1px solid #1a1a1a;
            display: flex;
            justify-content: flex-end;
        }
        
        .delete-btn {
            background: none;
            border: 1px solid #331111;
            border-radius: 3px;
            color: #884444;
            padding: 5px 12px;
            cursor: pointer;
            font-family: monospace;
            font-size: 9px;
            transition: all 0.3s;
        }
        
        .delete-btn:hover {
            background: #1a0a0a;
            border-color: #ff4444;
            color: #ff4444;
        }
        
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #3a3a3a;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .loading {
            text-align: center;
            padding: 80px;
            color: #4a4a4a;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        .loading-dot {
            animation: pulse 1s infinite;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            max-width: 500px;
            width: 90%;
            padding: 30px;
            text-align: center;
        }
        
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }
        
        .modal-btn {
            padding: 8px 25px;
            border: 1px solid #3a3a3a;
            background: #1a1a1a;
            color: #fff;
            cursor: pointer;
            font-family: monospace;
        }
        
        .modal-btn-danger {
            border-color: #661111;
            color: #ff6666;
        }
        
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .reports-grid {
                grid-template-columns: 1fr;
            }
            .filters-bar {
                flex-direction: column;
            }
            .filter-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<!-- Login View -->
<div id="loginView">
    <div class="login-container">
        <div class="login-box">
            <h1>lies<span>.lat</span></h1>
            <div class="login-subtitle">ADMIN CONSOLE</div>
            <input type="email" id="loginEmail" placeholder="EMAIL" autocomplete="email">
            <input type="password" id="loginPassword" placeholder="PASSWORD" autocomplete="current-password">
            <div id="loginError" class="error"></div>
            <button id="loginBtn">LOGIN</button>
            <div id="switchAuth" class="switch-btn">CREATE ACCOUNT</div>
        </div>
    </div>
</div>

<!-- Admin View -->
<div id="adminView" class="admin-container">
    <div class="header">
        <div class="logo">lies<span>.lat</span> <span style="font-size: 9px;">ADMIN</span></div>
        <button id="logoutBtn" class="logout-btn">LOGOUT</button>
    </div>
    
    <div class="main">
        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="statTotal">0</div>
                <div class="stat-label">TOTAL REPORTS</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statToday">0</div>
                <div class="stat-label">TODAY</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statUnique">0</div>
                <div class="stat-label">UNIQUE PCS</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statAvgRam">0</div>
                <div class="stat-label">AVG RAM (GB)</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statAvgCpu">0</div>
                <div class="stat-label">AVG CPU CORES</div>
            </div>
        </div>
        
        <!-- Filters -->
        <div class="filters-bar">
            <input type="text" id="filterName" class="filter-input" placeholder="🔍 Filter by PC name">
            <input type="text" id="filterUser" class="filter-input" placeholder="👤 Filter by username">
            <input type="text" id="filterIp" class="filter-input" placeholder="🌐 Filter by IP address">
            <button id="refreshBtn" class="refresh-btn">⟳ REFRESH</button>
            <button id="deleteAllBtn" class="refresh-btn delete-all-btn" style="display: none;">🗑 DELETE ALL FILTERED</button>
        </div>
        
        <!-- Reports -->
        <div id="reportsContainer">
            <div class="loading">
                <div class="loading-dot">⟳ LOADING REPORTS...</div>
            </div>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-bottom: 15px;">⚠️ CONFIRM DELETE</h3>
        <p id="deleteMessage">Are you sure you want to delete this report?</p>
        <div class="modal-buttons">
            <button id="cancelDeleteBtn" class="modal-btn">CANCEL</button>
            <button id="confirmDeleteBtn" class="modal-btn modal-btn-danger">DELETE</button>
        </div>
    </div>
</div>

<script>
    // Supabase Configuration
    const SUPABASE_URL = "https://jojyzviwhosnnkjbtbse.supabase.co";
    const SUPABASE_KEY = "sb_publishable_14hdnZTp2eAhvbxjz0aKdA_rrcCNWwX";
    const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    // State
    let currentUser = null;
    let allReports = [];
    let pendingDeleteId = null;
    let isLoginMode = true;
    
    // Initialize
    checkSession();
    
    async function checkSession() {
        const { data: { session } } = await supabase.auth.getSession();
        
        if (session) {
            currentUser = session.user;
            showAdmin();
            await loadReports();
            subscribeToRealtime();
        } else {
            showLogin();
        }
    }
    
    function showLogin() {
        document.getElementById('loginView').style.display = 'block';
        document.getElementById('adminView').style.display = 'none';
    }
    
    function showAdmin() {
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('adminView').style.display = 'block';
    }
    
    function subscribeToRealtime() {
        const channel = supabase
            .channel('pc_reports_channel')
            .on('postgres_changes', { 
                event: 'INSERT', 
                schema: 'public', 
                table: 'pc_reports' 
            }, (payload) => {
                console.log('New report received!', payload);
                loadReports();
            })
            .on('postgres_changes', { 
                event: 'DELETE', 
                schema: 'public', 
                table: 'pc_reports' 
            }, () => {
                loadReports();
            })
            .subscribe();
    }
    
    async function loadReports() {
        const { data, error } = await supabase
            .from('pc_reports')
            .select('*')
            .order('created_at', { ascending: false });
        
        if (error) {
            console.error('Error loading reports:', error);
            document.getElementById('reportsContainer').innerHTML = 
                `<div class="empty-state"><div class="empty-state-icon">⚠️</div>Error: ${error.message}<br>Make sure the table exists in Supabase</div>`;
            return;
        }
        
        allReports = data || [];
        applyFilters();
    }
    
    function applyFilters() {
        const nameFilter = document.getElementById('filterName').value.toLowerCase();
        const userFilter = document.getElementById('filterUser').value.toLowerCase();
        const ipFilter = document.getElementById('filterIp').value.toLowerCase();
        
        let filtered = allReports;
        
        if (nameFilter) {
            filtered = filtered.filter(r => (r.pc_name || '').toLowerCase().includes(nameFilter));
        }
        
        if (userFilter) {
            filtered = filtered.filter(r => (r.username || '').toLowerCase().includes(userFilter));
        }
        
        if (ipFilter) {
            filtered = filtered.filter(r => 
                (r.public_ip || '').toLowerCase().includes(ipFilter) ||
                (r.local_ip || '').toLowerCase().includes(ipFilter)
            );
        }
        
        renderReports(filtered);
        updateStats();
        
        // Show delete all button if filters are active and there are results
        const deleteAllBtn = document.getElementById('deleteAllBtn');
        if ((nameFilter || userFilter || ipFilter) && filtered.length > 0) {
            deleteAllBtn.style.display = 'block';
            deleteAllBtn.textContent = `🗑 DELETE ${filtered.length} FILTERED`;
        } else {
            deleteAllBtn.style.display = 'none';
        }
    }
    
    function updateStats() {
        const total = allReports.length;
        document.getElementById('statTotal').textContent = total;
        
        const today = new Date().toISOString().split('T')[0];
        const todayCount = allReports.filter(r => (r.created_at || '').startsWith(today)).length;
        document.getElementById('statToday').textContent = todayCount;
        
        const uniquePCs = new Set(allReports.map(r => r.pc_name)).size;
        document.getElementById('statUnique').textContent = uniquePCs;
        
        let totalRam = 0;
        let ramCount = 0;
        let totalCpu = 0;
        let cpuCount = 0;
        
        allReports.forEach(r => {
            const ramMatch = (r.memory_gb || '').match(/(\d+\.?\d*)/);
            if (ramMatch) {
                totalRam += parseFloat(ramMatch[1]);
                ramCount++;
            }
            if (r.cpu_cores) {
                totalCpu += r.cpu_cores;
                cpuCount++;
            }
        });
        
        const avgRam = ramCount > 0 ? (totalRam / ramCount).toFixed(1) : '0';
        const avgCpu = cpuCount > 0 ? Math.round(totalCpu / cpuCount) : '0';
        
        document.getElementById('statAvgRam').textContent = avgRam;
        document.getElementById('statAvgCpu').textContent = avgCpu;
    }
    
    function renderReports(reports) {
        const container = document.getElementById('reportsContainer');
        
        if (!reports || reports.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📡</div>
                    <div>NO REPORTS FOUND</div>
                    <div style="font-size: 10px; margin-top: 10px;">Run the Python script to send PC info</div>
                </div>`;
            return;
        }
        
        container.innerHTML = '<div class="reports-grid"></div>';
        const grid = container.querySelector('.reports-grid');
        
        reports.forEach(report => {
            const date = new Date(report.created_at);
            const timeStr = `${date.toLocaleDateString()} ${date.toLocaleTimeString()}`;
            const rawSpecs = report.raw_specs || {};
            
            const card = document.createElement('div');
            card.className = 'report-card';
            card.innerHTML = `
                <div class="report-header">
                    <span class="report-pc">🖥️ ${escapeHtml(report.pc_name || 'Unknown')}</span>
                    <span class="report-time">${escapeHtml(timeStr)}</span>
                </div>
                <div class="report-body">
                    <div class="report-row">
                        <span class="label">👤 User:</span>
                        <span class="value">${escapeHtml(report.username || 'Unknown')}</span>
                    </div>
                    <div class="report-row">
                        <span class="label">💿 OS:</span>
                        <span class="value">${escapeHtml(report.platform || 'Unknown')}</span>
                    </div>
                    <div class="report-row">
                        <span class="label">🧠 CPU:</span>
                        <span class="value">${report.cpu_cores || '?'} cores</span>
                    </div>
                    <div class="report-row">
                        <span class="label">💾 RAM:</span>
                        <span class="value">${escapeHtml(report.memory_gb || 'Unknown')}</span>
                    </div>
                    <div class="report-row">
                        <span class="label">🏠 Local IP:</span>
                        <span class="value local-ip">${escapeHtml(report.local_ip || 'Unknown')}</span>
                    </div>
                    <div class="report-row">
                        <span class="label">🌍 Public IP:</span>
                        <span class="value public-ip">${escapeHtml(report.public_ip || 'Unknown')}</span>
                    </div>
                    <div class="report-row">
                        <span class="label">🔢 MAC:</span>
                        <span class="value">${escapeHtml(rawSpecs.mac || 'Unknown')}</span>
                    </div>
                </div>
                <div class="report-footer">
                    <button class="delete-btn" onclick="promptDelete('${report.id}', '${escapeHtml(report.pc_name)}')">DELETE REPORT</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }
    
    function promptDelete(id, pcName) {
        pendingDeleteId = id;
        document.getElementById('deleteMessage').innerHTML = `Delete report from <strong>${pcName}</strong>?<br>This action cannot be undone.`;
        document.getElementById('deleteModal').style.display = 'flex';
    }
    
    async function confirmDelete() {
        if (!pendingDeleteId) return;
        
        const { error } = await supabase
            .from('pc_reports')
            .delete()
            .eq('id', pendingDeleteId);
        
        if (error) {
            alert('Error deleting: ' + error.message);
        } else {
            await loadReports();
        }
        
        closeModal();
        pendingDeleteId = null;
    }
    
    async function deleteAllFiltered() {
        const nameFilter = document.getElementById('filterName').value.toLowerCase();
        const userFilter = document.getElementById('filterUser').value.toLowerCase();
        const ipFilter = document.getElementById('filterIp').value.toLowerCase();
        
        let toDelete = allReports;
        
        if (nameFilter) {
            toDelete = toDelete.filter(r => (r.pc_name || '').toLowerCase().includes(nameFilter));
        }
        if (userFilter) {
            toDelete = toDelete.filter(r => (r.username || '').toLowerCase().includes(userFilter));
        }
        if (ipFilter) {
            toDelete = toDelete.filter(r => 
                (r.public_ip || '').toLowerCase().includes(ipFilter) ||
                (r.local_ip || '').toLowerCase().includes(ipFilter)
            );
        }
        
        if (toDelete.length === 0) return;
        
        if (confirm(`Delete ${toDelete.length} reports? This cannot be undone.`)) {
            for (const report of toDelete) {
                await supabase.from('pc_reports').delete().eq('id', report.id);
            }
            await loadReports();
        }
    }
    
    function closeModal() {
        document.getElementById('deleteModal').style.display = 'none';
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Event Listeners
    document.getElementById('loginBtn').onclick = async () => {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const errorDiv = document.getElementById('loginError');
        
        errorDiv.textContent = '';
        
        if (!email || !password) {
            errorDiv.textContent = 'Please enter email and password';
            return;
        }
        
        if (isLoginMode) {
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                errorDiv.textContent = error.message;
            } else {
                await checkSession();
            }
        } else {
            const { error } = await supabase.auth.signUp({ 
                email, 
                password,
                options: { data: { is_admin: true } }
            });
            if (error) {
                errorDiv.textContent = error.message;
            } else {
                errorDiv.textContent = 'Account created! Please login.';
                isLoginMode = true;
                document.getElementById('loginBtn').textContent = 'LOGIN';
                document.getElementById('switchAuth').textContent = 'CREATE ACCOUNT';
            }
        }
    };
    
    document.getElementById('switchAuth').onclick = () => {
        isLoginMode = !isLoginMode;
        document.getElementById('loginBtn').textContent = isLoginMode ? 'LOGIN' : 'CREATE ACCOUNT';
        document.getElementById('switchAuth').textContent = isLoginMode ? 'CREATE ACCOUNT' : 'BACK TO LOGIN';
        document.getElementById('loginError').textContent = '';
    };
    
    document.getElementById('logoutBtn').onclick = async () => {
        await supabase.auth.signOut();
        currentUser = null;
        showLogin();
    };
    
    document.getElementById('refreshBtn').onclick = () => loadReports();
    document.getElementById('filterName').oninput = () => applyFilters();
    document.getElementById('filterUser').oninput = () => applyFilters();
    document.getElementById('filterIp').oninput = () => applyFilters();
    document.getElementById('deleteAllBtn').onclick = () => deleteAllFiltered();
    document.getElementById('cancelDeleteBtn').onclick = closeModal;
    document.getElementById('confirmDeleteBtn').onclick = confirmDelete;
    
    // Close modal when clicking outside
    window.onclick = function(event) {
        const modal = document.getElementById('deleteModal');
        if (event.target === modal) {
            closeModal();
        }
    };
</script>
</body>
</html>
