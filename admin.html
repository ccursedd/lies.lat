<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lies.lat · admin panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #000;
  color: #fff;
  font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: rgba(255,255,255,0.3); text-decoration: none; transition: color 0.2s; }
a:hover { color: rgba(255,255,255,0.7); }

/* scroll */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); }

/* animations */
.fade-in { opacity: 0; animation: fadeIn 0.4s ease forwards; }
@keyframes fadeIn { to { opacity: 1; } }
@keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:0.8} }

/* inputs */
input, textarea {
  background: transparent; border: none;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  color: #fff; font-family: inherit; font-size: 12px;
  padding: 9px 0; outline: none; width: 100%;
  transition: border-color 0.2s;
}
input:focus, textarea:focus { border-color: rgba(255,255,255,0.25); }
input::placeholder { color: rgba(255,255,255,0.1); }

/* buttons */
.btn {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.35);
  font-family: inherit; font-size: 9px;
  letter-spacing: 3px; text-transform: uppercase;
  padding: 9px 24px; cursor: pointer;
  transition: all 0.2s; border-radius: 0;
}
.btn:hover { border-color: rgba(255,255,255,0.18); color: rgba(255,255,255,0.75); }
.btn-accent { border-color: rgba(255,255,255,0.15); color: rgba(255,255,255,0.6); }
.btn-accent:hover { border-color: rgba(255,255,255,0.35); color: #fff; }
.btn-dim { border-color: rgba(255,80,80,0.12); color: rgba(255,80,80,0.35); }
.btn-sm { padding: 5px 14px; font-size: 8px; letter-spacing: 2px; }
.btn-xs { padding: 4px 10px; font-size: 8px; }

/* auth page */
#page-auth {
  height: 100vh; display: flex; align-items: center;
  justify-content: center; flex-direction: column; gap: 0;
}
.auth-box {
  display: flex; flex-direction: column;
  align-items: center; gap: 18px; width: 260px;
}
.auth-wordmark {
  font-size: 11px; letter-spacing: 8px;
  text-transform: lowercase; color: rgba(255,255,255,0.15);
  margin-bottom: 10px;
}
.auth-wordmark span { color: rgba(255,255,255,0.5); }
.auth-err {
  font-size: 9px; letter-spacing: 1.5px;
  color: rgba(255,80,80,0.6); min-height: 12px; text-align: center;
}
.auth-sub {
  font-size: 9px; letter-spacing: 2px; color: rgba(255,255,255,0.1);
  cursor: pointer; transition: color 0.2s; text-transform: uppercase;
}
.auth-sub:hover { color: rgba(255,255,255,0.35); }

/* app shell */
#page-app { display: none; min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 80;
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  height: 48px; display: flex; align-items: center;
  padding: 0 32px;
}
.topbar-left {
  display: flex; align-items: center; gap: 20px; flex: 1;
}
.wordmark {
  font-size: 11px; letter-spacing: 5px; text-transform: lowercase;
  color: rgba(255,255,255,0.2); cursor: default;
}
.wordmark span { color: rgba(255,255,255,0.55); }
.topbar-user {
  font-size: 10px; letter-spacing: 1.5px;
  color: rgba(255,255,255,0.2);
}
.topbar-signout {
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  color: rgba(255,255,255,0.13); cursor: pointer;
  background: none; border: none; font-family: inherit;
}
.topbar-signout:hover { color: rgba(255,80,80,0.5); }

.main { max-width: 1000px; margin: 0 auto; padding: 48px 32px 80px; }

/* admin dashboard */
.dash-header { margin-bottom: 42px; }
.dash-title {
  font-size: 9px; letter-spacing: 6px; text-transform: uppercase;
  color: rgba(255,255,255,0.1); margin-bottom: 28px;
  display: flex; align-items: center; gap: 12px;
}
.dash-title::after {
  content: ''; flex: 1; height: 1px;
  background: rgba(255,255,255,0.05);
}

.stats-grid {
  display: grid; grid-template-columns: repeat(3,1fr);
  gap: 1px; background: rgba(255,255,255,0.05);
  margin-bottom: 48px;
}
.stat-card {
  background: #000;
  padding: 20px 20px;
}
.stat-label {
  font-size: 8px; letter-spacing: 3px; text-transform: uppercase;
  color: rgba(255,255,255,0.2); margin-bottom: 10px;
}
.stat-number {
  font-size: 32px; font-weight: 300;
  color: rgba(255,255,255,0.65);
}

.section-header {
  display: flex; justify-content: space-between;
  align-items: center; margin: 40px 0 20px;
}
.section-header h3 {
  font-size: 8px; letter-spacing: 4px; text-transform: uppercase;
  color: rgba(255,255,255,0.2); font-weight: normal;
}

/* spec cards */
.specs-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr));
  gap: 12px; margin-bottom: 48px;
}
.spec-card {
  border: 1px solid rgba(255,255,255,0.06);
  background: rgba(255,255,255,0.01);
  transition: all 0.2s;
  cursor: pointer;
}
.spec-card:hover { border-color: rgba(255,255,255,0.12); background: rgba(255,255,255,0.02);}
.spec-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.spec-avatar {
  width: 32px; text-align: center; font-size: 18px;
}
.spec-name {
  font-size: 12px; font-weight: 400; color: rgba(255,255,255,0.7);
  letter-spacing: 0.3px;
}
.spec-time {
  font-size: 8px; letter-spacing: 1px;
  color: rgba(255,255,255,0.2); margin-left: auto;
}
.spec-body {
  padding: 12px 16px;
  font-size: 10px;
  color: rgba(255,255,255,0.35);
  line-height: 1.5;
}
.spec-body span { color: rgba(255,255,255,0.65); }
.empty-msg {
  padding: 52px 0; text-align: center;
  font-size: 10px; letter-spacing: 3px;
  color: rgba(255,255,255,0.08); text-transform: uppercase;
}

/* toast */
#toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  padding: 9px 20px; font-size: 9px; letter-spacing: 2px;
  color: rgba(255,255,255,0.35); opacity: 0; transition: all 0.25s; z-index: 999;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.ok { color: rgba(200,255,200,0.5); border-color: rgba(200,255,200,0.1); }

/* modal simple */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8);
  backdrop-filter: blur(5px); z-index: 200;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.overlay.open { opacity: 1; pointer-events: all; }
.modal-panel {
  background: #0a0a0a; border: 1px solid rgba(255,255,255,0.08);
  max-width: 440px; width: 90%; padding: 28px 24px;
}
.modal-title {
  font-size: 10px; letter-spacing: 4px; margin-bottom: 20px;
  color: rgba(255,255,255,0.3);
}
.modal-close {
  float: right; background: none; border: none;
  color: rgba(255,255,255,0.2); font-size: 16px;
  cursor: pointer;
}

@media(max-width:600px){
  .topbar { padding: 0 16px; }
  .stats-grid { grid-template-columns: 1fr; gap: 0; }
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="page-loading" style="height:100vh;display:flex;align-items:center;justify-content:center;">
  <div style="width:3px;height:3px;background:rgba(255,255,255,0.15);animation:pulse 1.2s infinite;"></div>
</div>

<!-- AUTH -->
<div id="page-auth" style="display:none">
  <div class="auth-box fade-in">
    <div class="auth-wordmark">lies<span>.lat</span></div>
    <div id="auth-name-field" style="width:100%;display:none">
      <input type="text" id="a-name" placeholder="display name">
    </div>
    <div style="width:100%">
      <input type="email" id="a-email" placeholder="email" autocomplete="email">
    </div>
    <div style="width:100%">
      <input type="password" id="a-pass" placeholder="password" autocomplete="current-password">
    </div>
    <div class="auth-err" id="auth-err"></div>
    <button class="btn fade-in-delay" id="auth-submit-btn" onclick="authSubmit()">enter</button>
    <div class="auth-sub fade-in-delay2" id="auth-switch" onclick="authSwitch()">create account</div>
  </div>
</div>

<!-- ADMIN APP -->
<div id="page-app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="wordmark">lies<span>.lat</span></div>
      <div class="topbar-user" id="topbar-user"></div>
    </div>
    <div class="topbar-right">
      <button class="topbar-signout" onclick="doSignOut()">sign out</button>
    </div>
  </div>

  <div class="main">
    <div class="dash-header fade-in">
      <div class="dash-title">sys · admin console</div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">visitors tracked</div><div class="stat-number" id="stat-total">0</div></div>
        <div class="stat-card"><div class="stat-label">today</div><div class="stat-number" id="stat-today">0</div></div>
        <div class="stat-card"><div class="stat-label">unique hosts</div><div class="stat-number" id="stat-hosts">0</div></div>
      </div>
    </div>

    <div class="section-header">
      <h3>🖥️  live specs · pc inventory</h3>
      <button class="btn btn-sm" onclick="refreshSpecs()">↻ refresh</button>
    </div>
    <div id="specs-container">
      <div class="empty-msg">loading system reports...</div>
    </div>
  </div>
</div>

<!-- SIMPLE MODAL for viewing full details -->
<div class="overlay" id="modal-detail" onclick="closeModalOnBg(event)">
  <div class="modal-panel">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">full system report</div>
    <div id="modal-content" style="font-size:10px;color:rgba(255,255,255,0.5);line-height:1.7;white-space:pre-wrap;word-break:break-word;"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ========== SUPABASE CONFIG ==========
const SB_URL = 'https://jojyzviwhosnnkjbtbse.supabase.co';
const SB_KEY = 'sb_publishable_14hdnZTp2eAhvbxjz0aKdA_rrcCNwWx';
const { createClient } = supabase;
const sb = createClient(SB_URL, SB_KEY);

// SQL to create `pc_reports` table if not exists (admin will run once via setup)
const SETUP_SQL = `
CREATE TABLE IF NOT EXISTS pc_reports (
  id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
  visitor_id TEXT NOT NULL,
  pc_name TEXT,
  platform TEXT,
  cpu_cores INTEGER,
  memory_gb TEXT,
  user_agent TEXT,
  screen_res TEXT,
  language TEXT,
  timezone TEXT,
  raw_specs JSONB,
  created_at TIMESTAMPTZ DEFAULT now()
);

-- enable RLS
ALTER TABLE pc_reports ENABLE ROW LEVEL SECURITY;

-- policy: only authenticated users (admins) can read/write reports
DROP POLICY IF EXISTS "admin_full_access" ON pc_reports;
CREATE POLICY "admin_full_access" ON pc_reports
  FOR ALL USING (auth.role() = 'authenticated');

-- also allow insertion from "public" but only for inserting (public visitors must be able to submit)
-- we'll create separate policy for insert from anon (but we don't need select for anon)
DROP POLICY IF EXISTS "anon_insert_reports" ON pc_reports;
CREATE POLICY "anon_insert_reports" ON pc_reports
  FOR INSERT WITH CHECK (true);
`;

let currentUser = null;
let allReports = [];

// ========== BOOT & AUTH ==========
(async () => {
  const hash = location.hash;
  if (hash === '#setup') {
    showPage('auth');
    openSetupModal();
  } else {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      currentUser = session.user;
      showApp();
      await fetchReports();
    } else {
      showPage('auth');
    }
  }

  sb.auth.onAuthStateChange((ev, sess) => {
    if (ev === 'SIGNED_IN' && sess) {
      currentUser = sess.user;
      showApp();
      fetchReports();
    }
    if (ev === 'SIGNED_OUT') {
      currentUser = null;
      showPage('auth');
    }
  });
})();

function showPage(p) {
  document.getElementById('page-loading').style.display = 'none';
  document.getElementById('page-auth').style.display = p === 'auth' ? 'flex' : 'none';
  document.getElementById('page-app').style.display = p === 'app' ? 'block' : 'none';
}

function showApp() {
  showPage('app');
  const display = currentUser.user_metadata?.display_name || currentUser.email?.split('@')[0] || 'admin';
  document.getElementById('topbar-user').textContent = `@${display}`;
}

// ========== AUTH LOGIC ==========
let authMode = 'login';
function authSwitch() {
  authMode = authMode === 'login' ? 'signup' : 'login';
  document.getElementById('auth-switch').textContent = authMode === 'login' ? 'create account' : 'sign in';
  document.getElementById('auth-submit-btn').textContent = authMode === 'login' ? 'enter' : 'create';
  document.getElementById('auth-name-field').style.display = authMode === 'signup' ? 'block' : 'none';
  document.getElementById('auth-err').textContent = '';
}

async function authSubmit() {
  const email = document.getElementById('a-email').value.trim();
  const pass = document.getElementById('a-pass').value;
  const name = document.getElementById('a-name').value.trim();
  const errEl = document.getElementById('auth-err');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'fill all fields'; return; }

  const btn = document.getElementById('auth-submit-btn');
  btn.disabled = true; btn.textContent = '...';

  let error;
  if (authMode === 'login') {
    ({ error } = await sb.auth.signInWithPassword({ email, password: pass }));
  } else {
    if (pass.length < 6) { errEl.textContent = 'password min 6 chars'; btn.disabled=false; btn.textContent='create'; return; }
    ({ error } = await sb.auth.signUp({ email, password: pass, options: { data: { display_name: name || email.split('@')[0] } } }));
  }
  btn.disabled = false;
  btn.textContent = authMode === 'login' ? 'enter' : 'create';
  if (error) errEl.textContent = error.message;
  else if (authMode === 'signup') toast('account created! please sign in', 'ok');
}

async function doSignOut() { await sb.auth.signOut(); }

// ========== ADMIN: FETCH PC REPORTS ==========
async function fetchReports() {
  if (!currentUser) return;
  const { data, error } = await sb.from('pc_reports')
    .select('*')
    .order('created_at', { ascending: false });
  if (error) {
    if (error.code === '42P01') {
      openSetupModal();
      return;
    }
    toast('error: ' + error.message, 'bad');
    return;
  }
  allReports = data || [];
  renderSpecs();
  updateStats();
}

function updateStats() {
  document.getElementById('stat-total').textContent = allReports.length;
  const today = new Date().toISOString().slice(0,10);
  const todayCount = allReports.filter(r => r.created_at?.startsWith(today)).length;
  document.getElementById('stat-today').textContent = todayCount;
  const uniqueHosts = new Set(allReports.map(r => r.pc_name || r.visitor_id?.slice(0,8))).size;
  document.getElementById('stat-hosts').textContent = uniqueHosts;
}

function renderSpecs() {
  const container = document.getElementById('specs-container');
  if (!allReports.length) {
    container.innerHTML = '<div class="empty-msg">no pc reports yet · waiting for clients</div>';
    return;
  }
  container.innerHTML = '<div class="specs-grid"></div>';
  const grid = container.querySelector('.specs-grid');
  allReports.forEach((rep, idx) => {
    const pc = rep.pc_name || 'unknown device';
    const platform = rep.platform || '—';
    const cpu = rep.cpu_cores ? `${rep.cpu_cores} cores` : '?';
    const ram = rep.memory_gb || '?';
    const screen = rep.screen_res || '—';
    const time = rep.created_at ? new Date(rep.created_at).toLocaleString() : '—';
    const rawJson = rep.raw_specs || {};

    const card = document.createElement('div');
    card.className = 'spec-card';
    card.setAttribute('data-idx', idx);
    card.onclick = () => showSpecDetail(rep);
    card.innerHTML = `
      <div class="spec-header">
        <div class="spec-avatar">🖥️</div>
        <div class="spec-name">${escapeHtml(pc)}</div>
        <div class="spec-time">${escapeHtml(time.slice(0,10))}</div>
      </div>
      <div class="spec-body">
        <div>⚙️ <span>${escapeHtml(platform)}</span> &nbsp;|&nbsp; 🧠 ${cpu} &nbsp;|&nbsp; 💾 ${ram} GB</div>
        <div>🖵 ${escapeHtml(screen)} &nbsp;|&nbsp; 🌐 ${escapeHtml(rep.language || 'en')}</div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function showSpecDetail(report) {
  const modal = document.getElementById('modal-detail');
  const content = document.getElementById('modal-content');
  const details = `
    <strong>🖥️ PC NAME</strong>      ${escapeHtml(report.pc_name || '—')}
    <strong>🆔 VISITOR ID</strong>    ${escapeHtml(report.visitor_id || '—')}
    <strong>💿 PLATFORM</strong>      ${escapeHtml(report.platform || '—')}
    <strong>🧠 CPU CORES</strong>     ${report.cpu_cores ?? '?'}
    <strong>💾 MEMORY (GB)</strong>   ${report.memory_gb || '?'}
    <strong>🖵 SCREEN RES</strong>    ${escapeHtml(report.screen_res || '—')}
    <strong>🌍 LANGUAGE</strong>      ${escapeHtml(report.language || '—')}
    <strong>⏰ TIMEZONE</strong>       ${escapeHtml(report.timezone || '—')}
    <strong>📅 REPORT TIME</strong>   ${new Date(report.created_at).toLocaleString()}
    <strong>📡 USER AGENT</strong>    ${escapeHtml(report.user_agent || '—').slice(0,200)}
    <strong>⚙️ FULL JSON</strong>     ${escapeHtml(JSON.stringify(report.raw_specs || {}, null, 2))}
  `.replace(/\n/g, '<br>');
  content.innerHTML = details;
  modal.classList.add('open');
}

function closeModal() { document.getElementById('modal-detail').classList.remove('open'); }
function closeModalOnBg(e) { if (e.target === document.getElementById('modal-detail')) closeModal(); }

function refreshSpecs() { fetchReports(); toast('refreshed', 'ok'); }

// ========== SETUP MODAL (SQL) ==========
function openSetupModal() {
  const modal = document.createElement('div');
  modal.className = 'overlay open';
  modal.id = 'setup-overlay';
  modal.onclick = (e) => { if(e.target === modal) modal.remove(); };
  modal.innerHTML = `
    <div class="modal-panel" style="max-width:560px">
      <button class="modal-close" onclick="document.getElementById('setup-overlay')?.remove()">✕</button>
      <div class="modal-title">⚙️ one‑time database setup</div>
      <div style="font-size:10px;color:rgba(255,255,255,0.25);margin-bottom:14px;">run this SQL in your Supabase SQL editor to create the "pc_reports" table and policies:</div>
      <div style="background:#0f0f0f;border:1px solid rgba(255,255,255,0.1);padding:14px;font-family:monospace;font-size:9px;white-space:pre-wrap;overflow-x:auto;margin-bottom:16px;color:#ccc;">${escapeHtml(SETUP_SQL)}</div>
      <button class="btn btn-sm btn-accent" onclick="copySQLToClip()">copy SQL</button>
      <div style="margin-top:12px;font-size:9px;color:rgba(255,255,255,0.2);">after creating table, refresh the page</div>
    </div>
  `;
  document.body.appendChild(modal);
  window.copySQLToClip = () => {
    navigator.clipboard.writeText(SETUP_SQL);
    toast('SQL copied', 'ok');
    document.getElementById('setup-overlay')?.remove();
  };
}

// ========== PUBLIC COLLECTOR (embedded script) – runs even on non-authed page ==========
// This section auto-submits the visitor's PC info to supabase (anon insert)
// It is designed to be called from any page that loads this admin.html? but we embed here.
// We'll also expose a global function that can be triggered via python script (or automatically)
(function setupCollector() {
  // generate or get visitor id from localStorage
  let visitorId = localStorage.getItem('lies_visitor');
  if (!visitorId) {
    visitorId = 'v_' + Math.random().toString(36).substring(2, 12) + Date.now().toString(36);
    localStorage.setItem('lies_visitor', visitorId);
  }

  async function collectAndSend() {
    // gather system specs using client hints + basic navigator
    const platform = navigator.platform || navigator.userAgentData?.platform || 'unknown';
    const cpuCores = navigator.hardwareConcurrency || null;
    let memoryGB = null;
    if ('deviceMemory' in navigator) memoryGB = navigator.deviceMemory;
    else if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
      try {
        const he = await navigator.userAgentData.getHighEntropyValues(['platform', 'architecture', 'model']);
        if (he.platform) memoryGB = he.platform; // fallback just to show something
      } catch(e) {}
    }
    const screenRes = `${screen.width}x${screen.height}`;
    const language = navigator.language;
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const userAgent = navigator.userAgent;
    let pcName = 'unknown';
    try {
      // attempt to get hostname via webrtc? not reliable; but we can use os info from userAgentData if avail
      if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
        const he = await navigator.userAgentData.getHighEntropyValues(['platform', 'model']);
        if (he.model) pcName = he.model;
        else pcName = he.platform || pcName;
      }
    } catch(e) {}
    // fallback: generate from useragent
    if (pcName === 'unknown') {
      if (userAgent.includes('Windows')) pcName = 'Windows PC';
      else if (userAgent.includes('Mac')) pcName = 'Macintosh';
      else if (userAgent.includes('Linux')) pcName = 'Linux Machine';
      else pcName = 'Device';
    }

    const payload = {
      visitor_id: visitorId,
      pc_name: pcName,
      platform: platform,
      cpu_cores: cpuCores,
      memory_gb: memoryGB ? (memoryGB + ' GB') : (navigator.deviceMemory ? navigator.deviceMemory + ' GB' : null),
      user_agent: userAgent,
      screen_res: screenRes,
      language: language,
      timezone: timezone,
      raw_specs: {
        hardwareConcurrency: cpuCores,
        deviceMemory: navigator.deviceMemory || null,
        userAgent: userAgent,
        platform: platform,
        screen: screenRes,
        language: language,
        timeZone: timezone,
        cookiesEnabled: navigator.cookieEnabled,
        doNotTrack: navigator.doNotTrack
      }
    };

    try {
      await sb.from('pc_reports').insert(payload);
      console.log('pc report sent');
    } catch (err) {
      console.warn('failed to send pc report', err);
    }
  }

  // delay a bit to not block rendering
  if (document.readyState === 'loading') {
    window.addEventListener('DOMContentLoaded', () => { setTimeout(collectAndSend, 300); });
  } else {
    setTimeout(collectAndSend, 300);
  }
})();

// ========== TOAST & UTILS ==========
let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + (type === 'ok' ? 'ok' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = '', 2200);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
    return c;
  });
}

// expose global for manual trigger if needed
window.refreshSpecs = refreshSpecs;

console.log('admin panel ready — pc reports collector active');
</script>
