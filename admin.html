<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lies.lat - Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
        }
        
        .header {
            background: #000;
            border-bottom: 1px solid #222;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }
        
        .logo span {
            color: #888;
        }
        
        .logout-btn {
            background: none;
            border: 1px solid #333;
            color: #888;
            padding: 5px 15px;
            cursor: pointer;
            font-family: monospace;
        }
        
        .logout-btn:hover {
            border-color: #ff4444;
            color: #ff4444;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: #222;
            margin-bottom: 30px;
        }
        
        .stat {
            background: #0a0a0a;
            padding: 20px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
        }
        
        .stat-label {
            font-size: 10px;
            color: #666;
            margin-top: 5px;
            text-transform: uppercase;
        }
        
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-input {
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 12px;
        }
        
        .refresh-btn {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 20px;
            cursor: pointer;
            font-family: monospace;
        }
        
        .refresh-btn:hover {
            background: #333;
        }
        
        .reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 15px;
        }
        
        .report-card {
            background: #111;
            border: 1px solid #222;
            padding: 15px;
        }
        
        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #222;
        }
        
        .report-name {
            font-weight: bold;
            color: #fff;
            font-size: 14px;
        }
        
        .report-time {
            font-size: 10px;
            color: #666;
        }
        
        .report-details {
            font-size: 11px;
            line-height: 1.6;
        }
        
        .report-details div {
            margin: 5px 0;
        }
        
        .report-label {
            color: #888;
            display: inline-block;
            width: 80px;
        }
        
        .report-value {
            color: #ccc;
        }
        
        .delete-btn {
            background: none;
            border: 1px solid #442222;
            color: #aa4444;
            padding: 5px 10px;
            cursor: pointer;
            font-family: monospace;
            font-size: 10px;
            margin-top: 10px;
        }
        
        .delete-btn:hover {
            background: #220000;
            border-color: #ff4444;
            color: #ff4444;
        }
        
        .empty {
            text-align: center;
            padding: 60px;
            color: #666;
        }
        
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .login-box {
            background: #111;
            border: 1px solid #333;
            padding: 40px;
            width: 300px;
        }
        
        .login-box input {
            width: 100%;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            margin: 10px 0;
            font-family: monospace;
        }
        
        .login-box button {
            width: 100%;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
            font-family: monospace;
        }
        
        .login-box button:hover {
            background: #333;
        }
        
        .error {
            color: #ff4444;
            font-size: 11px;
            margin-top: 10px;
        }
        
        .switch {
            text-align: center;
            margin-top: 15px;
            color: #666;
            cursor: pointer;
            font-size: 11px;
        }
        
        .switch:hover {
            color: #aaa;
        }
        
        .title {
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        
        .public-ip {
            color: #44aa44;
        }
        
        .local-ip {
            color: #aa8844;
        }
    </style>
</head>
<body>
    <div id="login-view" style="display: none;">
        <div class="login-container">
            <div class="login-box">
                <div class="logo">lies<span>.lat</span></div>
                <div class="title" style="margin-top: 20px;">ADMIN LOGIN</div>
                <input type="email" id="email" placeholder="Email">
                <input type="password" id="password" placeholder="Password">
                <div id="login-error" class="error"></div>
                <button id="login-btn">LOGIN</button>
                <div class="switch" id="switch-btn">Create account</div>
            </div>
        </div>
    </div>
    
    <div id="admin-view" style="display: none;">
        <div class="header">
            <div class="logo">lies<span>.lat</span> <span style="font-size: 10px;">ADMIN</span></div>
            <button class="logout-btn" id="logout-btn">LOGOUT</button>
        </div>
        
        <div class="container">
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="total-reports">0</div>
                    <div class="stat-label">Total Reports</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="today-reports">0</div>
                    <div class="stat-label">Today</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="unique-pcs">0</div>
                    <div class="stat-label">Unique PCs</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="avg-ram">0</div>
                    <div class="stat-label">Avg RAM (GB)</div>
                </div>
            </div>
            
            <div class="filters">
                <input type="text" id="filter-name" class="filter-input" placeholder="Filter by PC name" style="width: 200px;">
                <input type="text" id="filter-ip" class="filter-input" placeholder="Filter by IP" style="width: 200px;">
                <button class="refresh-btn" id="refresh-btn">REFRESH</button>
            </div>
            
            <div id="reports-container" class="reports-grid">
                <div class="empty">Loading reports...</div>
            </div>
        </div>
    </div>
    
    <script>
        const SUPABASE_URL = "https://jojyzviwhosnnkjbtbse.supabase.co";
        const SUPABASE_KEY = "sb_publishable_14hdnZTp2eAhvbxjz0aKdA_rrcCNWwX";
        const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let currentUser = null;
        let allReports = [];
        
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                showAdmin();
                await loadReports();
            } else {
                showLogin();
            }
        }
        
        function showLogin() {
            document.getElementById('login-view').style.display = 'flex';
            document.getElementById('admin-view').style.display = 'none';
        }
        
        function showAdmin() {
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('admin-view').style.display = 'block';
        }
        
        async function loadReports() {
            const { data, error } = await supabase
                .from('pc_reports')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) {
                console.error('Error loading reports:', error);
                document.getElementById('reports-container').innerHTML = '<div class="empty">Error loading reports. Make sure table exists.</div>';
                return;
            }
            
            allReports = data || [];
            filterAndRender();
        }
        
        function filterAndRender() {
            const nameFilter = document.getElementById('filter-name').value.toLowerCase();
            const ipFilter = document.getElementById('filter-ip').value.toLowerCase();
            
            let filtered = allReports;
            if (nameFilter) {
                filtered = filtered.filter(r => (r.pc_name || '').toLowerCase().includes(nameFilter));
            }
            if (ipFilter) {
                filtered = filtered.filter(r => 
                    (r.public_ip || '').toLowerCase().includes(ipFilter) || 
                    (r.local_ip || '').toLowerCase().includes(ipFilter)
                );
            }
            
            renderReports(filtered);
            updateStats(filtered);
        }
        
        function updateStats(reports) {
            document.getElementById('total-reports').textContent = allReports.length;
            
            const today = new Date().toISOString().split('T')[0];
            const todayCount = allReports.filter(r => r.created_at?.startsWith(today)).length;
            document.getElementById('today-reports').textContent = todayCount;
            
            const uniquePCs = new Set(allReports.map(r => r.pc_name)).size;
            document.getElementById('unique-pcs').textContent = uniquePCs;
            
            let totalRam = 0;
            let ramCount = 0;
            allReports.forEach(r => {
                const ramMatch = (r.memory_gb || '').match(/(\d+\.?\d*)/);
                if (ramMatch) {
                    totalRam += parseFloat(ramMatch[1]);
                    ramCount++;
                }
            });
            const avgRam = ramCount > 0 ? (totalRam / ramCount).toFixed(1) : 0;
            document.getElementById('avg-ram').textContent = avgRam;
        }
        
        function renderReports(reports) {
            const container = document.getElementById('reports-container');
            
            if (!reports.length) {
                container.innerHTML = '<div class="empty">No reports found</div>';
                return;
            }
            
            container.innerHTML = reports.map(report => {
                const rawSpecs = report.raw_specs || {};
                const time = new Date(report.created_at).toLocaleString();
                
                return `
                    <div class="report-card">
                        <div class="report-header">
                            <span class="report-name">💻 ${escapeHtml(report.pc_name)}</span>
                            <span class="report-time">${time}</span>
                        </div>
                        <div class="report-details">
                            <div><span class="report-label">Username:</span> <span class="report-value">${escapeHtml(report.username)}</span></div>
                            <div><span class="report-label">OS:</span> <span class="report-value">${escapeHtml(report.platform)}</span></div>
                            <div><span class="report-label">CPU:</span> <span class="report-value">${report.cpu_cores || '?'} cores</span></div>
                            <div><span class="report-label">RAM:</span> <span class="report-value">${escapeHtml(report.memory_gb)}</span></div>
                            <div><span class="report-label">Local IP:</span> <span class="report-value local-ip">${escapeHtml(report.local_ip || 'unknown')}</span></div>
                            <div><span class="report-label">Public IP:</span> <span class="report-value public-ip">${escapeHtml(report.public_ip || 'unknown')}</span></div>
                        </div>
                        <button class="delete-btn" onclick="deleteReport('${report.id}')">DELETE REPORT</button>
                    </div>
                `;
            }).join('');
        }
        
        async function deleteReport(id) {
            if (!confirm('Delete this report?')) return;
            
            const { error } = await supabase
                .from('pc_reports')
                .delete()
                .eq('id', id);
            
            if (error) {
                alert('Error deleting: ' + error.message);
            } else {
                await loadReports();
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Auth
        let isLogin = true;
        
        document.getElementById('login-btn')?.addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');
            
            errorDiv.textContent = '';
            
            if (isLogin) {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    errorDiv.textContent = error.message;
                } else {
                    await checkSession();
                }
            } else {
                const { error } = await supabase.auth.signUp({ email, password });
                if (error) {
                    errorDiv.textContent = error.message;
                } else {
                    errorDiv.textContent = 'Account created! Please login.';
                    isLogin = true;
                    document.getElementById('switch-btn').textContent = 'Create account';
                    document.getElementById('login-btn').textContent = 'LOGIN';
                }
            }
        });
        
        document.getElementById('switch-btn')?.addEventListener('click', () => {
            isLogin = !isLogin;
            document.getElementById('switch-btn').textContent = isLogin ? 'Create account' : 'Back to login';
            document.getElementById('login-btn').textContent = isLogin ? 'LOGIN' : 'CREATE ACCOUNT';
            document.getElementById('login-error').textContent = '';
        });
        
        document.getElementById('logout-btn')?.addEventListener('click', async () => {
            await supabase.auth.signOut();
            currentUser = null;
            showLogin();
        });
        
        document.getElementById('refresh-btn')?.addEventListener('click', loadReports);
        document.getElementById('filter-name')?.addEventListener('input', filterAndRender);
        document.getElementById('filter-ip')?.addEventListener('input', filterAndRender);
        
        checkSession();
    </script>
</body>
</html>
