<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lies.lat - Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #ccc;
            font-family: 'Courier New', monospace;
        }
        
        /* Auth Container */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
        }
        
        .auth-box {
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 40px;
            width: 320px;
        }
        
        .auth-box h1 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #fff;
        }
        
        .auth-box h1 span {
            color: #666;
        }
        
        .auth-box input {
            width: 100%;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            margin: 10px 0;
            font-family: monospace;
        }
        
        .auth-box button {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
            font-family: monospace;
        }
        
        .auth-box button:hover {
            background: #222;
        }
        
        .switch-btn {
            text-align: center;
            margin-top: 15px;
            color: #666;
            cursor: pointer;
            font-size: 12px;
        }
        
        .switch-btn:hover {
            color: #999;
        }
        
        .error {
            color: #ff4444;
            font-size: 11px;
            margin-top: 10px;
            text-align: center;
        }
        
        /* Admin Container */
        .admin-container {
            display: none;
        }
        
        .header {
            background: #0a0a0a;
            border-bottom: 1px solid #222;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 18px;
            color: #fff;
        }
        
        .logo span {
            color: #666;
        }
        
        .logout-btn {
            background: none;
            border: 1px solid #333;
            color: #888;
            padding: 5px 15px;
            cursor: pointer;
            font-family: monospace;
        }
        
        .logout-btn:hover {
            border-color: #ff4444;
            color: #ff4444;
        }
        
        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: #222;
            margin-bottom: 30px;
        }
        
        .stat {
            background: #0a0a0a;
            padding: 20px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 32px;
            color: #fff;
        }
        
        .stat-label {
            font-size: 10px;
            color: #666;
            margin-top: 5px;
        }
        
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-input {
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 12px;
            font-family: monospace;
        }
        
        .refresh-btn {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 20px;
            cursor: pointer;
            font-family: monospace;
        }
        
        .refresh-btn:hover {
            background: #222;
        }
        
        .reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 15px;
        }
        
        .report-card {
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 15px;
        }
        
        .report-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #222;
        }
        
        .report-pc {
            font-weight: bold;
            color: #fff;
        }
        
        .report-time {
            font-size: 10px;
            color: #666;
        }
        
        .report-detail {
            font-size: 11px;
            margin: 8px 0;
        }
        
        .detail-label {
            color: #666;
            display: inline-block;
            width: 70px;
        }
        
        .detail-value {
            color: #ccc;
        }
        
        .public-ip {
            color: #44aa44;
        }
        
        .delete-btn {
            background: none;
            border: 1px solid #442222;
            color: #aa4444;
            padding: 5px 10px;
            cursor: pointer;
            font-family: monospace;
            font-size: 10px;
            margin-top: 10px;
        }
        
        .delete-btn:hover {
            background: #220000;
            border-color: #ff4444;
            color: #ff4444;
        }
        
        .empty {
            text-align: center;
            padding: 60px;
            color: #666;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
        }
    </style>
</head>
<body>

<!-- Login View -->
<div id="auth-view">
    <div class="auth-container">
        <div class="auth-box">
            <h1>lies<span>.lat</span></h1>
            <div style="font-size: 10px; color: #666; margin-bottom: 20px;">ADMIN ACCESS</div>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <div id="auth-error" class="error"></div>
            <button id="auth-btn">LOGIN</button>
            <div id="switch-auth" class="switch-btn">CREATE ACCOUNT</div>
        </div>
    </div>
</div>

<!-- Admin View -->
<div id="admin-view" class="admin-container">
    <div class="header">
        <div class="logo">lies<span>.lat</span> <span style="font-size: 10px;">ADMIN</span></div>
        <button id="logout-btn" class="logout-btn">LOGOUT</button>
    </div>
    
    <div class="main">
        <div class="stats">
            <div class="stat">
                <div class="stat-number" id="total-reports">0</div>
                <div class="stat-label">TOTAL REPORTS</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="today-reports">0</div>
                <div class="stat-label">TODAY</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="unique-pcs">0</div>
                <div class="stat-label">UNIQUE PCS</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="avg-ram">0</div>
                <div class="stat-label">AVG RAM (GB)</div>
            </div>
        </div>
        
        <div class="filters">
            <input type="text" id="filter-name" class="filter-input" placeholder="Filter by PC name">
            <input type="text" id="filter-ip" class="filter-input" placeholder="Filter by IP">
            <button id="refresh-btn" class="refresh-btn">REFRESH</button>
        </div>
        
        <div id="reports-list">
            <div class="loading">Loading reports...</div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://jojyzviwhosnnkjbtbse.supabase.co";
    const SUPABASE_KEY = "sb_publishable_14hdnZTp2eAhvbxjz0aKdA_rrcCNWwX";
    const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let currentUser = null;
    let allReports = [];
    
    // Check session on load
    checkSession();
    
    async function checkSession() {
        const { data: { session } } = await supabase.auth.getSession();
        
        if (session) {
            currentUser = session.user;
            showAdmin();
            await loadReports();
            subscribeToRealtime();
        } else {
            showAuth();
        }
    }
    
    function showAuth() {
        document.getElementById('auth-view').style.display = 'block';
        document.getElementById('admin-view').style.display = 'none';
    }
    
    function showAdmin() {
        document.getElementById('auth-view').style.display = 'none';
        document.getElementById('admin-view').style.display = 'block';
    }
    
    function subscribeToRealtime() {
        supabase
            .channel('pc_reports')
            .on('postgres_changes', { 
                event: 'INSERT', 
                schema: 'public', 
                table: 'pc_reports' 
            }, (payload) => {
                console.log('New report received!', payload);
                loadReports();
            })
            .subscribe();
    }
    
    async function loadReports() {
        const { data, error } = await supabase
            .from('pc_reports')
            .select('*')
            .order('created_at', { ascending: false });
        
        if (error) {
            console.error('Error:', error);
            document.getElementById('reports-list').innerHTML = `<div class="empty">Error: ${error.message}</div>`;
            return;
        }
        
        allReports = data || [];
        applyFilters();
    }
    
    function applyFilters() {
        const nameFilter = document.getElementById('filter-name').value.toLowerCase();
        const ipFilter = document.getElementById('filter-ip').value.toLowerCase();
        
        let filtered = allReports;
        
        if (nameFilter) {
            filtered = filtered.filter(r => (r.pc_name || '').toLowerCase().includes(nameFilter));
        }
        
        if (ipFilter) {
            filtered = filtered.filter(r => 
                (r.public_ip || '').toLowerCase().includes(ipFilter) ||
                (r.local_ip || '').toLowerCase().includes(ipFilter)
            );
        }
        
        renderReports(filtered);
        updateStats();
    }
    
    function updateStats() {
        const total = allReports.length;
        document.getElementById('total-reports').textContent = total;
        
        const today = new Date().toISOString().split('T')[0];
        const todayCount = allReports.filter(r => (r.created_at || '').startsWith(today)).length;
        document.getElementById('today-reports').textContent = todayCount;
        
        const uniquePCs = new Set(allReports.map(r => r.pc_name)).size;
        document.getElementById('unique-pcs').textContent = uniquePCs;
        
        let totalRam = 0;
        let ramCount = 0;
        allReports.forEach(r => {
            const match = (r.memory_gb || '').match(/(\d+\.?\d*)/);
            if (match) {
                totalRam += parseFloat(match[1]);
                ramCount++;
            }
        });
        const avgRam = ramCount > 0 ? (totalRam / ramCount).toFixed(1) : '0';
        document.getElementById('avg-ram').textContent = avgRam;
    }
    
    function renderReports(reports) {
        const container = document.getElementById('reports-list');
        
        if (!reports || reports.length === 0) {
            container.innerHTML = '<div class="empty">No reports found</div>';
            return;
        }
        
        container.innerHTML = reports.map(report => {
            const date = new Date(report.created_at);
            const timeStr = `${date.getMonth()+1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2,'0')}`;
            
            return `
                <div class="report-card">
                    <div class="report-header">
                        <span class="report-pc">🖥️ ${escapeHtml(report.pc_name || 'Unknown')}</span>
                        <span class="report-time">${timeStr}</span>
                    </div>
                    <div class="report-detail">
                        <span class="detail-label">User:</span>
                        <span class="detail-value">${escapeHtml(report.username || 'Unknown')}</span>
                    </div>
                    <div class="report-detail">
                        <span class="detail-label">OS:</span>
                        <span class="detail-value">${escapeHtml(report.platform || 'Unknown')}</span>
                    </div>
                    <div class="report-detail">
                        <span class="detail-label">CPU:</span>
                        <span class="detail-value">${report.cpu_cores || '?'} cores</span>
                    </div>
                    <div class="report-detail">
                        <span class="detail-label">RAM:</span>
                        <span class="detail-value">${escapeHtml(report.memory_gb || 'Unknown')}</span>
                    </div>
                    <div class="report-detail">
                        <span class="detail-label">Local IP:</span>
                        <span class="detail-value">${escapeHtml(report.local_ip || 'Unknown')}</span>
                    </div>
                    <div class="report-detail">
                        <span class="detail-label">Public IP:</span>
                        <span class="detail-value public-ip">${escapeHtml(report.public_ip || 'Unknown')}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteReport(${report.id})">DELETE REPORT</button>
                </div>
            `;
        }).join('');
    }
    
    async function deleteReport(id) {
        if (!confirm('Are you sure you want to delete this report?')) return;
        
        const { error } = await supabase
            .from('pc_reports')
            .delete()
            .eq('id', id);
        
        if (error) {
            alert('Error deleting: ' + error.message);
        } else {
            await loadReports();
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Auth handlers
    let isLogin = true;
    
    document.getElementById('auth-btn').onclick = async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('auth-error');
        
        errorDiv.textContent = '';
        
        if (!email || !password) {
            errorDiv.textContent = 'Please enter email and password';
            return;
        }
        
        if (isLogin) {
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                errorDiv.textContent = error.message;
            } else {
                await checkSession();
            }
        } else {
            const { error } = await supabase.auth.signUp({ 
                email, 
                password,
                options: {
                    data: { is_admin: true }
                }
            });
            if (error) {
                errorDiv.textContent = error.message;
            } else {
                errorDiv.textContent = 'Account created! Please login.';
                isLogin = true;
                document.getElementById('auth-btn').textContent = 'LOGIN';
                document.getElementById('switch-auth').textContent = 'CREATE ACCOUNT';
            }
        }
    };
    
    document.getElementById('switch-auth').onclick = () => {
        isLogin = !isLogin;
        document.getElementById('auth-btn').textContent = isLogin ? 'LOGIN' : 'CREATE ACCOUNT';
        document.getElementById('switch-auth').textContent = isLogin ? 'CREATE ACCOUNT' : 'BACK TO LOGIN';
        document.getElementById('auth-error').textContent = '';
    };
    
    document.getElementById('logout-btn').onclick = async () => {
        await supabase.auth.signOut();
        currentUser = null;
        showAuth();
    };
    
    document.getElementById('refresh-btn').onclick = () => {
        loadReports();
    };
    
    document.getElementById('filter-name').oninput = () => {
        applyFilters();
    };
    
    document.getElementById('filter-ip').oninput = () => {
        applyFilters();
    };
</script>
</body>
</html>
