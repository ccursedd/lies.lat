<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lies.lat — admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { background: #000; color: #fff; font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace; -webkit-font-smoothing: antialiased; }
    a { color: rgba(255,255,255,0.4); text-decoration: none; }
    a:hover { color: rgba(255,255,255,0.8); }

    .btn { background: transparent; border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.4); font-family: inherit; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; padding: 10px 28px; cursor: pointer; transition: all 0.25s; border-radius: 2px; }
    .btn:hover { border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.8); }
    .btn-primary { border-color: rgba(88,101,242,0.3); color: rgba(88,101,242,0.7); }
    .btn-primary:hover { border-color: rgba(88,101,242,0.5); color: rgba(88,101,242,1); }
    .btn-danger { border-color: rgba(255,80,80,0.15); color: rgba(255,80,80,0.4); }
    .btn-danger:hover { border-color: rgba(255,80,80,0.4); color: rgba(255,80,80,0.8); }
    .btn-sm { padding: 6px 16px; font-size: 9px; letter-spacing: 2px; }

    input, select, textarea { background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.1); color: #fff; font-family: inherit; font-size: 13px; padding: 8px 0; outline: none; width: 100%; transition: border-color 0.25s; }
    input:focus, select:focus, textarea:focus { border-color: rgba(255,255,255,0.3); }
    input::placeholder { color: rgba(255,255,255,0.12); }
    select { cursor: pointer; } select option { background: #111; }
    textarea { resize: vertical; min-height: 60px; border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: 3px; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

    .fade-in { opacity: 0; animation: fadeIn 0.6s ease forwards; }
    @keyframes fadeIn { to { opacity: 1; } }

    /* AUTH */
    .auth-page { height: 100vh; display: flex; align-items: center; justify-content: center; }
    .auth-box { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 280px; }
    .auth-title { font-size: 11px; letter-spacing: 6px; text-transform: uppercase; opacity: 0.2; margin-bottom: 8px; }
    .auth-field { width: 100%; position: relative; }
    .auth-field input { text-align: center; letter-spacing: 2px; }
    .field-line { position: absolute; bottom: 0; left: 50%; width: 0; height: 1px; background: rgba(255,255,255,0.5); transition: width 0.3s ease, left 0.3s ease; }
    .auth-field input:focus ~ .field-line { width: 100%; left: 0; }
    .error-msg { font-size: 10px; color: rgba(255,80,80,0.7); letter-spacing: 1px; min-height: 14px; text-align: center; }

    /* DASHBOARD */
    .dashboard { display: none; min-height: 100vh; }
    .top-bar { border-bottom: 1px solid rgba(255,255,255,0.06); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: #000; z-index: 50; }
    .top-bar-title { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.25; }
    .main { padding: 40px 32px; max-width: 1100px; margin: 0 auto; }
    .section-title { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.2; margin-bottom: 24px; }

    /* USER CARDS */
    .users-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 48px; }
    .user-card { border: 1px solid rgba(255,255,255,0.06); border-radius: 4px; padding: 20px; transition: border-color 0.2s; position: relative; }
    .user-card:hover { border-color: rgba(255,255,255,0.12); }
    .user-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,0.05); flex-shrink: 0; }
    .user-name { font-size: 13px; color: rgba(255,255,255,0.8); }
    .user-slug { font-size: 10px; color: rgba(255,255,255,0.25); letter-spacing: 1px; margin-top: 2px; }
    .user-card-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .user-dot { position: absolute; top: 16px; right: 16px; width: 6px; height: 6px; border-radius: 50%; background: rgba(80,200,80,0.4); }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 100; align-items: center; justify-content: center; overflow-y: auto; padding: 24px; }
    .modal-overlay.open { display: flex; }
    .modal { background: #080808; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; padding: 36px; width: 100%; max-width: 540px; }
    .modal-title { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.2; margin-bottom: 32px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .form-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 22px; }
    .form-label { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.3; }
    .form-actions { display: flex; gap: 12px; margin-top: 32px; justify-content: flex-end; }
    .divider { border: none; border-top: 1px solid rgba(255,255,255,0.05); margin: 20px 0; }
    .slug-hint { font-size: 10px; color: rgba(88,101,242,0.5); letter-spacing: 1px; margin-top: 4px; }

    /* EFFECTS */
    .effects-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .eff-btn { border: 1px solid rgba(255,255,255,0.06); border-radius: 3px; padding: 10px 14px; cursor: pointer; transition: all 0.2s; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.22); display: flex; align-items: center; gap: 8px; background: transparent; font-family: inherit; }
    .eff-btn.on { border-color: rgba(88,101,242,0.3); color: rgba(88,101,242,0.7); }
    .eff-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.08); flex-shrink: 0; }
    .eff-btn.on .eff-dot { background: rgba(88,101,242,0.7); }

    /* AUDIO UPLOAD */
    .tracks-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .track-row { display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.06); border-radius: 3px; padding: 8px 12px; }
    .track-title-input { flex: 1; border: none; border-bottom: 1px solid rgba(255,255,255,0.1); background: transparent; color: #fff; font-family: inherit; font-size: 12px; padding: 2px 0; outline: none; }
    .track-title-input:focus { border-color: rgba(255,255,255,0.3); }
    .track-src { font-size: 10px; color: rgba(255,255,255,0.2); flex: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track-del { background: none; border: none; color: rgba(255,80,80,0.3); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 4px; transition: color 0.2s; font-family: inherit; }
    .track-del:hover { color: rgba(255,80,80,0.8); }
    .upload-zone { border: 1px dashed rgba(255,255,255,0.08); border-radius: 3px; padding: 16px; text-align: center; cursor: pointer; transition: border-color 0.2s; position: relative; }
    .upload-zone:hover { border-color: rgba(255,255,255,0.18); }
    .upload-zone.drag { border-color: rgba(88,101,242,0.4); }
    .upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
    .upload-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.2); pointer-events: none; }
    .upload-progress { height: 2px; background: rgba(88,101,242,0.2); border-radius: 1px; margin-top: 8px; overflow: hidden; display: none; }
    .upload-progress-bar { height: 100%; background: rgba(88,101,242,0.7); width: 0%; transition: width 0.3s; }

    /* TOAST */
    .toast { position: fixed; bottom: 24px; right: 24px; background: #111; border: 1px solid rgba(255,255,255,0.08); padding: 12px 20px; font-size: 11px; letter-spacing: 1px; border-radius: 3px; opacity: 0; transform: translateY(8px); transition: all 0.3s; z-index: 9999; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.ok  { border-color: rgba(80,200,80,0.25); color: rgba(80,200,80,0.85); }
    .toast.err { border-color: rgba(255,80,80,0.25); color: rgba(255,80,80,0.85); }
  </style>
</head>
<body>

<!-- AUTH -->
<div class="auth-page fade-in" id="auth-page">
  <div class="auth-box">
    <div class="auth-title">lies.lat admin</div>
    <div class="auth-field">
      <input type="email" id="u-email" placeholder="email" autocomplete="email" autofocus>
      <div class="field-line"></div>
    </div>
    <div class="auth-field">
      <input type="password" id="u-pass" placeholder="password" autocomplete="current-password">
      <div class="field-line"></div>
    </div>
    <div class="error-msg" id="auth-err"></div>
    <button class="btn" onclick="login()">enter</button>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="top-bar">
    <div class="top-bar-title">lies.lat / admin</div>
    <div style="display:flex;gap:12px;align-items:center;">
      <a href="/" style="font-size:9px;letter-spacing:2px;text-transform:uppercase;opacity:0.18;color:#fff;">← site</a>
      <button class="btn btn-sm btn-primary" onclick="openModal()">+ new user</button>
      <button class="btn btn-sm" onclick="logout()">sign out</button>
    </div>
  </div>
  <div class="main">
    <div class="section-title">users</div>
    <div class="users-grid" id="users-grid">
      <div style="font-size:11px;opacity:0.15;letter-spacing:2px;">loading...</div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">new user</div>

    <div class="form-row">
      <div class="form-field">
        <div class="form-label">display name</div>
        <input type="text" id="f-name" placeholder="mev">
      </div>
      <div class="form-field">
        <div class="form-label">url slug</div>
        <input type="text" id="f-slug" placeholder="mev" oninput="slugInput()">
        <div class="slug-hint" id="slug-hint">lies.lat/...</div>
      </div>
    </div>

    <div class="form-field">
      <div class="form-label">discord user id</div>
      <input type="text" id="f-discord" placeholder="922332301126414337">
    </div>

    <div class="form-row">
      <div class="form-field">
        <div class="form-label">tiktok</div>
        <input type="text" id="f-tiktok" placeholder="https://tiktok.com/@user">
      </div>
      <div class="form-field">
        <div class="form-label">twitter / x</div>
        <input type="text" id="f-twitter" placeholder="https://x.com/user">
      </div>
    </div>

    <div class="form-row">
      <div class="form-field">
        <div class="form-label">instagram</div>
        <input type="text" id="f-instagram" placeholder="https://instagram.com/user">
      </div>
      <div class="form-field">
        <div class="form-label">custom link label</div>
        <input type="text" id="f-link-label" placeholder="my site">
      </div>
    </div>

    <div class="form-field">
      <div class="form-label">custom link url</div>
      <input type="text" id="f-link" placeholder="https://...">
    </div>

    <div class="form-field">
      <div class="form-label">background video url</div>
      <input type="text" id="f-video" placeholder="https://github.com/.../video.mp4">
    </div>

    <hr class="divider">

    <!-- AUDIO TRACKS -->
    <div class="form-label" style="margin-bottom:14px;">music tracks</div>
    <div class="tracks-list" id="tracks-list"></div>

    <div class="upload-zone" id="upload-zone">
      <input type="file" id="audio-file-input" accept="audio/*" multiple onchange="handleFileSelect(this.files)">
      <div class="upload-label">drop audio files here or click to upload</div>
      <div class="upload-progress" id="upload-progress">
        <div class="upload-progress-bar" id="upload-bar"></div>
      </div>
    </div>
    <div style="font-size:9px;color:rgba(255,255,255,0.12);letter-spacing:1px;margin-top:8px;">
      or paste a direct url below
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <input type="text" id="f-track-url" placeholder="https://.../song.mp3" style="flex:2;">
      <input type="text" id="f-track-title" placeholder="track title" style="flex:1;">
      <button class="btn btn-sm" onclick="addTrackUrl()" style="flex-shrink:0;">add</button>
    </div>

    <hr class="divider">

    <!-- EFFECTS -->
    <div class="form-label" style="margin-bottom:14px;">effects</div>
    <div class="effects-grid" id="effects-grid">
      <button class="eff-btn on" data-fx="snow"        onclick="toggleFx(this)"><div class="eff-dot"></div>snow</button>
      <button class="eff-btn on" data-fx="sparkle"     onclick="toggleFx(this)"><div class="eff-dot"></div>sparkle trail</button>
      <button class="eff-btn on" data-fx="crossCursor" onclick="toggleFx(this)"><div class="eff-dot"></div>cross cursor</button>
      <button class="eff-btn"    data-fx="rain"        onclick="toggleFx(this)"><div class="eff-dot"></div>rain</button>
    </div>

    <div class="form-actions">
      <button class="btn btn-sm" onclick="closeModal()">cancel</button>
      <button class="btn btn-sm btn-primary" id="save-btn" onclick="saveUser()">save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://dyxxpuirsuqtuehvijdf.supabase.co'
  const SUPABASE_KEY = 'sb_publishable_8IaNO6bOuQHZdVyAPeP1Qg_sjjcGcVy'
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

  let editingId = null
  // tracks array: [{title, src}] — src is either a full URL or a storage path
  let tracksList = []

  // ── Auth ──
  document.querySelectorAll('input').forEach(el => {
    el.addEventListener('keydown', e => { if (e.key === 'Enter' && !document.getElementById('modal').classList.contains('open')) login() })
  })

  async function login() {
    const email = document.getElementById('u-email').value.trim()
    const pass  = document.getElementById('u-pass').value
    const err   = document.getElementById('auth-err')
    err.textContent = ''
    if (!email || !pass) { err.textContent = 'fill in both fields'; return }
    const { error } = await sb.auth.signInWithPassword({ email, password: pass })
    if (error) { err.textContent = error.message || 'denied'; document.getElementById('u-pass').value = ''; return }
    showDashboard()
  }

  async function logout() {
    await sb.auth.signOut()
    document.getElementById('dashboard').style.display = 'none'
    document.getElementById('auth-page').style.display = 'flex'
  }

  async function checkSession() {
    const { data: { session } } = await sb.auth.getSession()
    if (session) showDashboard()
  }

  function showDashboard() {
    document.getElementById('auth-page').style.display = 'none'
    document.getElementById('dashboard').style.display = 'block'
    loadUsers()
  }

  // ── Users ──
  async function loadUsers() {
    const grid = document.getElementById('users-grid')
    grid.innerHTML = '<div style="font-size:11px;opacity:0.15;letter-spacing:2px;">loading...</div>'
    const { data, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false })
    if (error) { grid.innerHTML = `<div style="color:rgba(255,80,80,0.5);font-size:11px;">${error.message}</div>`; return }
    if (!data || !data.length) { grid.innerHTML = '<div style="font-size:11px;opacity:0.12;letter-spacing:2px;">no users yet — create one</div>'; return }
    grid.innerHTML = ''
    data.forEach(u => grid.appendChild(buildCard(u)))
  }

  function buildCard(u) {
    const card = document.createElement('div')
    card.className = 'user-card'
    card.innerHTML = `
      <div class="user-dot"></div>
      <div class="user-card-header">
        <img class="user-avatar" id="avatar-${u.id}" src="${u.avatar_url || ''}" onerror="this.src=''" alt="">
        <div>
          <div class="user-name">${u.display_name || u.slug}</div>
          <div class="user-slug">lies.lat/${u.slug}</div>
        </div>
      </div>
      ${u.discord_id ? `<div style="font-size:9px;opacity:0.18;letter-spacing:1px;margin-bottom:4px;">discord ${u.discord_id}</div>` : ''}
      ${u.tracks && u.tracks.length ? `<div style="font-size:9px;opacity:0.18;letter-spacing:1px;margin-bottom:4px;">${u.tracks.length} track${u.tracks.length>1?'s':''}</div>` : ''}
      <div class="user-card-actions">
        <button class="btn btn-sm btn-primary" onclick='editUser(${JSON.stringify(u).replace(/'/g,"&#39;")})'>edit</button>
        <a class="btn btn-sm" href="/profile.html?u=${u.slug}" target="_blank">view →</a>
        <button class="btn btn-sm btn-danger" onclick="deleteUser('${u.id}')">del</button>
      </div>
    `
    if (u.discord_id) loadDiscordAvatar(u.discord_id, `avatar-${u.id}`)
    return card
  }

  async function loadDiscordAvatar(discordId, imgId) {
    const apis = [
      { url: `https://japi.rest/discord/v1/user/${discordId}`, parse: j => j.data?.avatar },
      { url: `https://discordlookup.mesalytic.moe/v1/user/${discordId}`, parse: j => j.avatar?.id },
    ]
    for (const api of apis) {
      try {
        const res = await fetch(api.url); if (!res.ok) continue
        const json = await res.json(); const av = api.parse(json)
        if (av) { const el = document.getElementById(imgId); if (el) el.src = `https://cdn.discordapp.com/avatars/${discordId}/${av}.${av.startsWith('a_')?'gif':'png'}?size=128`; break }
      } catch(e) {}
    }
  }

  async function deleteUser(id) {
    if (!confirm('delete this user?')) return
    const { error } = await sb.from('profiles').delete().eq('id', id)
    if (error) { toast(error.message, 'err'); return }
    toast('user deleted', 'ok'); loadUsers()
  }

  // ── Modal ──
  function openModal() {
    editingId = null; tracksList = []
    document.getElementById('modal-title').textContent = 'new user'
    clearForm()
    document.getElementById('modal').classList.add('open')
  }

  function editUser(u) {
    editingId = u.id
    document.getElementById('modal-title').textContent = 'edit user'
    document.getElementById('f-name').value    = u.display_name || ''
    document.getElementById('f-slug').value    = u.slug || ''
    document.getElementById('f-discord').value = u.discord_id || ''
    document.getElementById('f-tiktok').value    = u.socials?.tiktok || ''
    document.getElementById('f-twitter').value   = u.socials?.twitter || ''
    document.getElementById('f-instagram').value = u.socials?.instagram || ''
    document.getElementById('f-link').value       = u.socials?.link || ''
    document.getElementById('f-link-label').value = u.socials?.link_label || ''
    document.getElementById('f-video').value      = u.bg_video || ''
    slugInput()

    tracksList = u.tracks ? [...u.tracks] : []
    renderTracks()

    // effects
    document.querySelectorAll('.eff-btn').forEach(el => {
      const fx = el.dataset.fx
      const on = u.effects ? !!u.effects[fx] : (fx === 'snow' || fx === 'sparkle' || fx === 'crossCursor')
      el.classList.toggle('on', on)
    })

    document.getElementById('modal').classList.add('open')
  }

  function closeModal() { document.getElementById('modal').classList.remove('open') }

  function clearForm() {
    ;['f-name','f-slug','f-discord','f-tiktok','f-twitter','f-instagram','f-link','f-link-label','f-video','f-track-url','f-track-title'].forEach(id => {
      const el = document.getElementById(id); if (el) el.value = ''
    })
    document.getElementById('slug-hint').textContent = 'lies.lat/...'
    document.querySelectorAll('.eff-btn').forEach(el => {
      const fx = el.dataset.fx
      el.classList.toggle('on', fx === 'snow' || fx === 'sparkle' || fx === 'crossCursor')
    })
    tracksList = []
    renderTracks()
  }

  function slugInput() {
    const v = document.getElementById('f-slug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'')
    document.getElementById('slug-hint').textContent = 'lies.lat/' + (v || '...')
  }

  function toggleFx(el) { el.classList.toggle('on') }

  // ── Tracks ──
  function renderTracks() {
    const list = document.getElementById('tracks-list')
    list.innerHTML = ''
    tracksList.forEach((t, i) => {
      const row = document.createElement('div')
      row.className = 'track-row'
      row.innerHTML = `
        <input class="track-title-input" value="${t.title || ''}" placeholder="title" oninput="tracksList[${i}].title=this.value">
        <div class="track-src" title="${t.src}">${t.src.length > 40 ? '…'+t.src.slice(-38) : t.src}</div>
        <button class="track-del" onclick="removeTrack(${i})">×</button>
      `
      list.appendChild(row)
    })
  }

  function removeTrack(i) {
    tracksList.splice(i, 1)
    renderTracks()
  }

  function addTrackUrl() {
    const url   = document.getElementById('f-track-url').value.trim()
    const title = document.getElementById('f-track-title').value.trim()
    if (!url) { toast('enter a url', 'err'); return }
    tracksList.push({ title: title || url.split('/').pop().replace(/\.[^.]+$/, ''), src: url })
    document.getElementById('f-track-url').value = ''
    document.getElementById('f-track-title').value = ''
    renderTracks()
  }

  // ── Audio upload to Supabase Storage ──
  const uploadZone = document.getElementById('upload-zone')
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag') })
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'))
  uploadZone.addEventListener('drop', e => { e.preventDefault(); uploadZone.classList.remove('drag'); handleFileSelect(e.dataTransfer.files) })

  async function handleFileSelect(files) {
    if (!files || !files.length) return
    const prog = document.getElementById('upload-progress')
    const bar  = document.getElementById('upload-bar')
    prog.style.display = 'block'

    for (let i = 0; i < files.length; i++) {
      const file = files[i]
      bar.style.width = Math.round((i / files.length) * 100) + '%'

      // slug-based folder: audio/{slug}/{filename}
      const slug = document.getElementById('f-slug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'') || 'shared'
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_')
      const path = `${slug}/${safeName}`

      const { error } = await sb.storage.from('audio').upload(path, file, { upsert: true })
      if (error) { toast('upload failed: ' + error.message, 'err'); continue }

      const title = file.name.replace(/\.[^.]+$/, '')
      tracksList.push({ title, src: path })  // store path, not full URL
      renderTracks()
      toast('uploaded: ' + title, 'ok')
    }
    bar.style.width = '100%'
    setTimeout(() => { prog.style.display = 'none'; bar.style.width = '0%' }, 800)
    // reset file input
    document.getElementById('audio-file-input').value = ''
  }

  // ── Save ──
  async function saveUser() {
    const slug = document.getElementById('f-slug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'')
    if (!slug) { toast('slug is required', 'err'); return }

    const saveBtn = document.getElementById('save-btn')
    saveBtn.textContent = 'saving...'; saveBtn.disabled = true

    const effects = {}
    document.querySelectorAll('.eff-btn').forEach(el => { effects[el.dataset.fx] = el.classList.contains('on') })

    const payload = {
      slug,
      display_name: document.getElementById('f-name').value.trim(),
      discord_id:   document.getElementById('f-discord').value.trim(),
      bg_video:     document.getElementById('f-video').value.trim(),
      tracks:       tracksList.length ? tracksList : null,
      effects,
      socials: {
        tiktok:     document.getElementById('f-tiktok').value.trim(),
        twitter:    document.getElementById('f-twitter').value.trim(),
        instagram:  document.getElementById('f-instagram').value.trim(),
        link:       document.getElementById('f-link').value.trim(),
        link_label: document.getElementById('f-link-label').value.trim(),
      },
      updated_at: new Date().toISOString(),
    }

    let error
    if (editingId) {
      ;({ error } = await sb.from('profiles').update(payload).eq('id', editingId))
    } else {
      ;({ error } = await sb.from('profiles').insert({ ...payload, created_at: new Date().toISOString() }))
    }

    saveBtn.textContent = 'save'; saveBtn.disabled = false

    if (error) { toast(error.message, 'err'); return }
    toast(editingId ? 'saved' : 'user created', 'ok')
    closeModal(); loadUsers()
  }

  // ── Toast ──
  function toast(msg, type = 'ok') {
    const t = document.getElementById('toast')
    t.textContent = msg; t.className = `toast ${type} show`
    setTimeout(() => t.className = 'toast', 2800)
  }

  checkSession()
</script>
</body>
</html>
