<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lies.lat</title>
  <link rel="icon" type="image/png" href="/fav/f0.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: monospace; }
    
    #profile-container {
      text-align: center;
      color: white;
      z-index: 10;
      position: relative;
    }
    
    .pfp {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
    }
    
    .name {
      font-size: 24px;
      margin-bottom: 20px;
      opacity: 0.8;
    }
    
    .social-links {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
    }
    
    .social-link {
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 2px;
    }
    
    .social-link:hover {
      color: rgba(255,255,255,0.8);
    }
    
    #error-message {
      text-align: center;
      color: rgba(255,255,255,0.3);
      font-size: 14px;
      letter-spacing: 2px;
    }
    
    audio {
      position: fixed;
      bottom: 20px;
      right: 20px;
      opacity: 0.3;
      width: 200px;
    }
    
    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.4;
      z-index: 0;
    }
  </style>
</head>
<body>
  <video id="bg-video" autoplay loop muted playsinline></video>
  
  <div id="profile-container">
    <img class="pfp" id="avatar" src="" alt="">
    <div class="name" id="display-name"></div>
    <div id="social-links" class="social-links"></div>
  </div>
  
  <div id="error-message" style="display: none;">User not found</div>
  
  <audio id="audio-player" controls style="display: none;"></audio>

  <script>
    // Get the slug from the URL path (no #, no query params)
    function getSlugFromPath() {
      let path = window.location.pathname;
      // Remove leading slash
      let slug = path.replace(/^\//, '');
      
      // Also check query param as fallback
      let urlParams = new URLSearchParams(window.location.search);
      let querySlug = urlParams.get('u');
      
      console.log('Path:', path);
      console.log('Slug from path:', slug);
      console.log('Slug from query:', querySlug);
      
      // Use path slug if it exists and is not a special page
      if (slug && slug !== '' && slug !== 'profile.html' && slug !== 'admin.html' && slug !== 'favicon.ico' && !slug.startsWith('fav/')) {
        return slug;
      }
      
      // Fallback to query param
      if (querySlug && querySlug !== 'profile.html') {
        return querySlug;
      }
      
      return null;
    }
    
    const SLUG = getSlugFromPath();
    console.log('Final slug:', SLUG);
    
    // If no slug, we're on the wrong page - redirect to home
    if (!SLUG) {
      document.getElementById('profile-container').style.display = 'none';
      document.getElementById('error-message').style.display = 'block';
      document.getElementById('error-message').innerHTML = 'No user specified. <a href="/" style="color: white;">Go home</a>';
    } else {
      // Initialize Supabase
      const SUPABASE_URL = 'https://dyxxpuirsuqtuehvijdf.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_8IaNO6bOuQHZdVyAPeP1Qg_sjjcGcVy';
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      
      async function loadProfile() {
        console.log('Loading profile for slug:', SLUG);
        
        const { data, error } = await sb
          .from('profiles')
          .select('*')
          .eq('slug', SLUG)
          .maybeSingle();
        
        console.log('Supabase response:', data, error);
        
        if (error || !data) {
          console.error('Profile not found');
          document.getElementById('profile-container').style.display = 'none';
          document.getElementById('error-message').style.display = 'block';
          return;
        }
        
        // Set title
        document.title = (data.display_name || SLUG) + ' - lies.lat';
        
        // Set display name
        document.getElementById('display-name').textContent = data.display_name || SLUG;
        
        // Set avatar
        if (data.discord_id) {
          // Try to fetch Discord avatar
          try {
            const res = await fetch(`https://japi.rest/discord/v1/user/${data.discord_id}`);
            const json = await res.json();
            if (json.data && json.data.avatar) {
              const avatarUrl = `https://cdn.discordapp.com/avatars/${data.discord_id}/${json.data.avatar}.png?size=256`;
              document.getElementById('avatar').src = avatarUrl;
            }
          } catch(e) {
            console.log('Could not fetch Discord avatar');
          }
        }
        
        // Set background video
        if (data.bg_video) {
          const video = document.getElementById('bg-video');
          video.src = data.bg_video;
          video.load();
          video.play().catch(e => console.log('Video autoplay blocked:', e));
        }
        
        // Set social links
        const socialsContainer = document.getElementById('social-links');
        socialsContainer.innerHTML = '';
        
        const socials = data.socials || {};
        
        if (socials.tiktok) {
          addSocialLink(socialsContainer, 'TikTok', socials.tiktok);
        }
        if (socials.twitter) {
          addSocialLink(socialsContainer, 'X/Twitter', socials.twitter);
        }
        if (socials.instagram) {
          addSocialLink(socialsContainer, 'Instagram', socials.instagram);
        }
        if (socials.link) {
          addSocialLink(socialsContainer, socials.link_label || 'Link', socials.link);
        }
        
        // Set audio player
        if (data.tracks && data.tracks.length > 0) {
          const audio = document.getElementById('audio-player');
          const firstTrack = data.tracks[0];
          let audioUrl = firstTrack.src;
          
          // If it's a storage path, get public URL
          if (audioUrl && !audioUrl.startsWith('http')) {
            const { data: publicUrl } = sb.storage.from('audio').getPublicUrl(audioUrl);
            audioUrl = publicUrl.publicUrl;
          }
          
          if (audioUrl) {
            audio.src = audioUrl;
            audio.style.display = 'block';
            audio.volume = 0.3;
            // Try to autoplay
            audio.play().catch(e => console.log('Audio autoplay blocked'));
          }
        }
      }
      
      function addSocialLink(container, label, url) {
        const link = document.createElement('a');
        link.href = url;
        link.textContent = label;
        link.className = 'social-link';
        link.target = '_blank';
        link.onclick = function(e) {
          e.preventDefault();
          document.body.style.opacity = '0';
          setTimeout(() => {
            window.location.href = url;
          }, 300);
        };
        container.appendChild(link);
      }
      
      loadProfile();
    }
  </script>
</body>
</html>
