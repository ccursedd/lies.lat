<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lies.lat - Profile</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: monospace; color: white; }
    .container { text-align: center; max-width: 600px; padding: 40px; }
    .pfp { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; margin: 20px auto; background: #111; }
    .name { font-size: 28px; margin: 20px 0; letter-spacing: 2px; }
    .socials { display: flex; gap: 20px; justify-content: center; margin: 30px 0; flex-wrap: wrap; }
    .social-link { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 12px; letter-spacing: 2px; padding: 8px 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: 2px; transition: all 0.3s; }
    .social-link:hover { border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.8); }
    audio { position: fixed; bottom: 20px; right: 20px; opacity: 0.4; width: 250px; }
    video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.4; z-index: -1; }
    .error { color: rgba(255,80,80,0.6); font-size: 14px; margin: 20px 0; }
    .debug { font-size: 10px; color: rgba(255,255,255,0.2); margin-top: 40px; padding: 20px; border-top: 1px solid rgba(255,255,255,0.1); word-break: break-all; }
    .loading { color: rgba(255,255,255,0.3); font-size: 12px; letter-spacing: 2px; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 0.8; } 100% { opacity: 0.3; } }
  </style>
</head>
<body>
  <video id="bg-video" autoplay loop muted playsinline></video>
  
  <div class="container">
    <div id="loading" class="loading">loading profile...</div>
    <div id="profile-content" style="display: none;">
      <img class="pfp" id="avatar" src="" alt="">
      <div class="name" id="display-name"></div>
      <div id="socials" class="socials"></div>
    </div>
    <div id="error" class="error" style="display: none;"></div>
    <div id="debug" class="debug"></div>
  </div>
  
  <audio id="audio-player" controls style="display: none;"></audio>

  <script>
    // Supabase configuration
    const SUPABASE_URL = 'https://dyxxpuirsuqtuehvijdf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_8IaNO6bOuQHZdVyAPeP1Qg_sjjcGcVy';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    // Debug logging
    const debugDiv = document.getElementById('debug');
    function logDebug(message) {
      console.log(message);
      debugDiv.innerHTML += message + '<br>';
    }
    
    logDebug('=== PROFILE LOAD STARTED ===');
    logDebug('Current URL: ' + window.location.href);
    logDebug('Pathname: ' + window.location.pathname);
    logDebug('Search: ' + window.location.search);
    
    // Get slug from URL parameters (Vercel rewrite)
    let slug = null;
    
    // Method 1: Check query parameter
    const urlParams = new URLSearchParams(window.location.search);
    slug = urlParams.get('slug');
    logDebug('Slug from ?slug= param: ' + slug);
    
    // Method 2: Check 'u' parameter
    if (!slug) {
      slug = urlParams.get('u');
      logDebug('Slug from ?u= param: ' + slug);
    }
    
    // Method 3: Extract from pathname
    if (!slug) {
      let path = window.location.pathname;
      let pathSlug = path.replace(/^\/|\/$/g, '');
      if (pathSlug && pathSlug !== 'profile.html' && pathSlug !== 'admin.html' && pathSlug !== 'index.html') {
        slug = pathSlug;
        logDebug('Slug from pathname: ' + slug);
      }
    }
    
    // If still no slug, try hash
    if (!slug && window.location.hash && window.location.hash.length > 1) {
      slug = window.location.hash.substring(1);
      logDebug('Slug from hash: ' + slug);
    }
    
    logDebug('FINAL SLUG: ' + slug);
    
    async function loadProfile() {
      if (!slug) {
        logDebug('ERROR: No slug found in URL');
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').innerHTML = 'No user specified.<br><br>Try: <a href="/mev" style="color: white;">/mev</a>';
        return;
      }
      
      logDebug('Querying Supabase for slug: "' + slug + '"');
      
      try {
        // First, let's get ALL profiles to see what's in the database
        const { data: allProfiles, error: allError } = await sb
          .from('profiles')
          .select('slug, display_name');
        
        logDebug('All profiles in database:');
        if (allProfiles) {
          allProfiles.forEach(p => logDebug('  - slug: "' + p.slug + '", name: ' + p.display_name));
        }
        if (allError) logDebug('Error fetching all profiles: ' + allError.message);
        
        // Now get the specific profile
        const { data, error } = await sb
          .from('profiles')
          .select('*')
          .eq('slug', slug)
          .maybeSingle();
        
        logDebug('Profile query result:');
        logDebug('  Data: ' + JSON.stringify(data, null, 2));
        logDebug('  Error: ' + (error ? error.message : 'None'));
        
        if (error || !data) {
          logDebug('ERROR: Profile not found for slug: ' + slug);
          document.getElementById('loading').style.display = 'none';
          document.getElementById('error').style.display = 'block';
          document.getElementById('error').innerHTML = 'User "' + slug + '" not found.<br><br>Available users: ' + (allProfiles ? allProfiles.map(p => p.slug).join(', ') : 'none');
          return;
        }
        
        logDebug('SUCCESS: Profile loaded!');
        
        // Hide loading, show content
        document.getElementById('loading').style.display = 'none';
        document.getElementById('profile-content').style.display = 'block';
        
        // Set title
        document.title = (data.display_name || slug) + ' - lies.lat';
        
        // Set display name
        document.getElementById('display-name').textContent = data.display_name || slug;
        
        // Set avatar from Discord
        if (data.discord_id) {
          logDebug('Fetching Discord avatar for ID: ' + data.discord_id);
          try {
            const res = await fetch(`https://japi.rest/discord/v1/user/${data.discord_id}`);
            const json = await res.json();
            if (json.data && json.data.avatar) {
              const avatarUrl = `https://cdn.discordapp.com/avatars/${data.discord_id}/${json.data.avatar}.png?size=256`;
              document.getElementById('avatar').src = avatarUrl;
              logDebug('Discord avatar loaded');
            } else {
              logDebug('No Discord avatar found');
            }
          } catch(e) {
            logDebug('Discord fetch error: ' + e.message);
          }
        }
        
        // Set background video
        if (data.bg_video) {
          logDebug('Loading background video: ' + data.bg_video);
          const video = document.getElementById('bg-video');
          video.src = data.bg_video;
          video.load();
          video.play().catch(e => logDebug('Video autoplay blocked: ' + e.message));
        }
        
        // Set social links
        const socialsContainer = document.getElementById('socials');
        socialsContainer.innerHTML = '';
        
        const socials = data.socials || {};
        logDebug('Social links: ' + Object.keys(socials).join(', '));
        
        if (socials.tiktok) addSocialLink(socialsContainer, 'TIKTOK', socials.tiktok);
        if (socials.twitter) addSocialLink(socialsContainer, 'X', socials.twitter);
        if (socials.instagram) addSocialLink(socialsContainer, 'INSTAGRAM', socials.instagram);
        if (socials.link) addSocialLink(socialsContainer, socials.link_label || 'LINK', socials.link);
        
        // Set audio player
        if (data.tracks && data.tracks.length > 0) {
          logDebug('Loading audio track');
          const audio = document.getElementById('audio-player');
          const firstTrack = data.tracks[0];
          let audioUrl = firstTrack.src;
          
          if (audioUrl && !audioUrl.startsWith('http')) {
            const { data: publicUrl } = sb.storage.from('audio').getPublicUrl(audioUrl);
            audioUrl = publicUrl.publicUrl;
          }
          
          if (audioUrl) {
            audio.src = audioUrl;
            audio.style.display = 'block';
            audio.volume = 0.3;
            audio.play().catch(e => logDebug('Audio autoplay blocked: ' + e.message));
            logDebug('Audio URL: ' + audioUrl);
          }
        } else {
          logDebug('No tracks found in profile');
        }
        
      } catch (err) {
        logDebug('UNEXPECTED ERROR: ' + err.message);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').innerHTML = 'Error loading profile: ' + err.message;
      }
    }
    
    function addSocialLink(container, label, url) {
      const link = document.createElement('a');
      link.href = url;
      link.textContent = label;
      link.className = 'social-link';
      link.target = '_blank';
      link.onclick = function(e) {
        e.preventDefault();
        document.body.style.transition = 'opacity 0.3s';
        document.body.style.opacity = '0';
        setTimeout(() => { window.location.href = url; }, 300);
      };
      container.appendChild(link);
    }
    
    // Make sure Supabase is loaded before starting
    function waitForSupabase() {
      if (typeof supabase !== 'undefined') {
        logDebug('Supabase loaded successfully');
        loadProfile();
      } else {
        logDebug('Waiting for Supabase to load...');
        setTimeout(waitForSupabase, 100);
      }
    }
    
    waitForSupabase();
  </script>
</body>
</html>
